<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세무사 OX v18 — 전수 클릭 QA</title>
<style>
  body{margin:0;background:#1b1f2a;color:#e8edf7;font:13px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
  h1{font-size:15px;margin:10px 14px 6px;color:#9fb3d1}
  .sum{margin:0 14px 8px;font-weight:800;font-size:14px}
  .sum b.ok{color:#34d399} .sum b.ng{color:#f87171}
  .wrap{display:flex;gap:16px;padding:0 14px 24px;align-items:flex-start}
  .frame{background:#0d1017;border-radius:12px;padding:6px;flex:none}
  .frame .cap{font-size:11px;color:#8fa3c0;margin:0 0 5px 3px}
  iframe{border:0;display:block;background:#fff;border-radius:6px}
  #log{flex:1;min-width:340px;max-height:78vh;overflow:auto;background:#0d1017;border-radius:12px;padding:10px 12px}
  .r{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid #1c2433}
  .r .s{font-weight:900;flex:none;width:38px}
  .r.pass .s{color:#34d399} .r.fail .s{color:#f87171}
  .r .n{flex:1}
  .r .x{color:#fca5a5;font-size:11px;word-break:break-all;max-width:46%}
  .sec{margin:9px 0 2px;color:#7dd3fc;font-weight:800}
</style>
</head>
<body>
<h1>세무사 1차 OX v18 · 전수 클릭 QA (360 / 390 / 430)</h1>
<div class="sum" id="sum">준비 중…</div>
<div class="wrap">
  <div class="frame"><p class="cap">360 × 780</p><iframe id="f360" width="360" height="780"></iframe></div>
  <div class="frame"><p class="cap">390 × 844</p><iframe id="f390" width="390" height="844"></iframe></div>
  <div class="frame"><p class="cap">430 × 932</p><iframe id="f430" width="430" height="932"></iframe></div>
  <div id="log"></div>
</div>
<script>
var P = 0, F = 0, LOG = [];
function log(kind, name, extra){
  LOG.push({kind:kind, name:name, extra:extra || ''});
  var box = document.getElementById('log');
  if(kind === 'sec'){
    var d = document.createElement('div'); d.className = 'sec'; d.textContent = name; box.appendChild(d); return;
  }
  if(kind === 'pass') P++; else F++;
  var r = document.createElement('div');
  r.className = 'r ' + kind;
  r.innerHTML = '<span class="s">' + (kind === 'pass' ? 'PASS' : 'FAIL') + '</span><span class="n"></span>' + (extra ? '<span class="x"></span>' : '');
  r.querySelector('.n').textContent = name;
  if(extra) r.querySelector('.x').textContent = String(extra).slice(0, 300);
  box.appendChild(r);
}
function t(name, cond, extra){ log(cond ? 'pass' : 'fail', name, cond ? '' : extra); return !!cond; }
function eq(name, a, b){ return t(name, a === b, 'got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b)); }
function summ(){
  document.getElementById('sum').innerHTML = 'PASS <b class="ok">' + P + '</b> · FAIL <b class="ng">' + F + '</b>';
  window.__QA = {pass:P, fail:F, logs:LOG};
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms || 60); }); }

var FID = 'f360';
function fr(){ return document.getElementById(FID); }
function W(){ return fr().contentWindow; }
function D(){ return fr().contentDocument; }
function q(sel){ return D().querySelector(sel); }
function qa(sel){ return Array.prototype.slice.call(D().querySelectorAll(sel)); }
function body(){ return D().body.innerText || ''; }
function api(){ return W().__sebeop; }
function click(el){ if(!el) return false; el.click(); return true; }
function clickSel(sel){ return click(q(sel)); }
function loadFrame(id, w, h){
  return new Promise(function(res){
    var f = document.getElementById(id);
    f.width = w; f.height = h;
    var done = false;
    f.onload = function(){ if(done) return; done = true; setTimeout(res, 340); };
    f.src = '../index.html?qa=1&h=' + Date.now();
  });
}
function reload(){
  return new Promise(function(res){
    var f = fr(), done = false;
    f.onload = function(){ if(done) return; done = true; setTimeout(res, 360); };
    f.contentWindow.location.reload();
  });
}
function reset(){
  try{ W().localStorage.removeItem('sebeop_ox_v1'); }catch(e){}
  return reload();
}
function qOf(id){ return api().bank.filter(function(x){ return x.id === id; })[0]; }

async function run(){
  FID = 'f360';
  await loadFrame('f360', 360, 780);
  await loadFrame('f390', 390, 844);
  await loadFrame('f430', 430, 932);
  FID = 'f360';
  await reset();
  await suite();

  log('sec', 'K. 390px 뷰포트');
  FID = 'f390';
  await reset();
  t('390 홈 렌더', !!q('.goal'));
  var cw390 = fr().width;   /* iframe 설계 폭 — 데스크톱 스크롤바 폭에 휘둘리지 않게 */
  t('390 가로 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1);
  clickSel('#bar button[data-act="daily"]');
  await wait(80);
  eq('390 데일리 10문항', api().session().ids.length, 10);
  eq('390 도트 10개', qa('.dots i').length, 10);
  t('390 O/X 버튼 보임', !!q('.pick.o'));
  clickSel('.chip.blindc'); await wait(60);
  clickSel('.blindbar .bsel[data-m="word"]'); await wait(70);
  eq('390 고르개 항목 3개', qa('.blindbar .bsel').length, 3);
  t('390 고르개 높이 정상', D().querySelector('.blindbar').getBoundingClientRect().height < 120,
    Math.round(D().querySelector('.blindbar').getBoundingClientRect().height));
  t('390 고르개 가로 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  clickSel('.chip.blindc'); await wait(50);
  /* v16 — 390에서도 오답 필터·통계 참고 배지·다크·답안지까지 훑는다 */
  var ST9 = api().state;
  ST9.wrong = {}; ST9.rc = {}; ST9.att = []; ST9.ans = {};
  var p390 = api().bank.slice(600, 605);
  p390.forEach(function(bq, i){
    ST9.wrong[bq.id] = {w: 1, last: Date.now(), res: 0};
    if(i < 2) ST9.rc[bq.id] = {c: 'con', at: Date.now()};
  });
  var p390j = api().bank.filter(function(bq){ return bq.subject === '재정학'; }).slice(20, 24);
  p390j.forEach(function(bq){ ST9.att.push([bq.id, 30000, 1]); });
  api().HOME(); await wait(50);
  clickSel('button[data-act="wrong"]'); await wait(80);
  eq('390 원인 필터 렌더', qa('.fchips .fchip').length, 7);
  t('390 필터 칩 높이 정상', D().querySelector('.fchips').getBoundingClientRect().height < 100,
    Math.round(D().querySelector('.fchips').getBoundingClientRect().height));
  t('390 오답노트 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  clickSel('.fchip[data-c="con"]'); await wait(70);
  eq('390 개념혼동 2건', qa('.li').length, 2);
  clickSel('#statsbtn'); await wait(90);
  eq('390 표본 참고 배지', qa('.tsweet .refb').length, 1);
  t('390 통계 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  clickSel('#themebtn'); await wait(40); clickSel('#themebtn'); await wait(60);
  eq('390 다크 모드', D().documentElement.getAttribute('data-theme'), 'dark');
  t('390 다크 통계 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1);
  clickSel('button[data-act="home"]'); await wait(60);
  t('390 다크 홈 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1);
  clickSel('button[data-act="rounds"]'); await wait(70);
  clickSel('button[data-act="start-exam"]'); await wait(90);
  eq('390 답안지 화면', api().view().name, 'exam');
  t('390 답안지 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  clickSel('.xrow .xtgl button[data-v="O"]'); await wait(40);
  t('390 답안지 표시', !!q('.xtgl button.on.o'));
  clickSel('#themebtn'); await wait(40); clickSel('#themebtn'); await wait(50);
  eq('390 라이트로 복귀', D().documentElement.getAttribute('data-theme'), 'light');
  api().HOME(); await wait(60);
  /* v18 — 390에서 빈칸 카드 모드 칩·탭별 출제 버튼·교차 칸 */
  eq('390 빈칸 카드 모드 칩 3개', qa('.blindcard .bmodes .fchip').length, 3);
  t('390 빈칸 카드 높이 정상', D().querySelector('.blindcard').getBoundingClientRect().height < 280,
    Math.round(D().querySelector('.blindcard').getBoundingClientRect().height));
  t('390 빈칸 카드 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  clickSel('.blindcard .fchip[data-m="who"]'); await wait(80);
  t('390 카드에서 주체 모드', api().blindWhoOn() === true);
  clickSel('button[data-act="start-blind"]'); await wait(140);
  t('390 주체 빈칸 세트', qa('.stmt .bl.who').length > 0, qa('.stmt .bl.who').length);
  api().HOME(); await wait(40);
  api().setBlindWho(false); api().setBlindWord(false); api().setBlind(false); await wait(50);
  ST9.wrong = {}; ST9.rc = {}; ST9.dnk = {};
  var p390b = api().bank.slice(610, 616);
  p390b.forEach(function(bq, i){
    ST9.wrong[bq.id] = {w: 1, last: Date.now(), res: i >= 4 ? 1 : 0};
    if(i === 0) ST9.dnk[bq.id] = 1;
  });
  api().HOME(); await wait(50);
  clickSel('button[data-act="wrong"]'); await wait(90);
  eq('390 행 버튼 3개씩', qa('.li .acts button').length, qa('.li').length * 3);
  eq('390 다시 볼 CTA', (q('#bar button[data-act="start-wrong"]') || {innerText: ''}).innerText, '🔁 오답 집중 4문항 출제');
  clickSel('.tabs button[data-t="dnk"]'); await wait(80);
  eq('390 모름 CTA', (q('#bar button[data-act="start-wrong"]') || {innerText: ''}).innerText, '🤷 모름 1문항 출제');
  t('390 원인 필터와 탭이 같이 걸린다', !!q('.fchips .fchip[data-act="rc7"]'));
  t('390 오답노트 3버튼 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw390 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  t('390 콘솔 오류 0건', (W().__errs || []).length === 0, JSON.stringify(W().__errs || []));

  log('sec', 'Y. 430×932 뷰포트');
  FID = 'f430';
  await reset();
  t('430 홈 렌더', !!q('.goal'));
  var cw430 = fr().width;
  t('430 가로 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  t('430 빈칸 전용 카드', !!q('button[data-act="start-blind"]'));
  clickSel('button[data-act="start-blind"]'); await wait(120);
  eq('430 빈칸 세트 10문항', api().session().ids.length, 10);
  t('430 빈칸이 실제로 가려짐', qa('.stmt .bl').length > 0, qa('.stmt .bl').length);
  t('430 학습 화면 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1);
  clickSel('#statsbtn'); await wait(90);
  t('430 시간 카드 있음', body().indexOf('시간 × 정답률') >= 0);
  t('430 통계 가로 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  /* v16 — 430에서 빈칸 많은 지문·오답 필터·다크 */
  var dq430 = null;
  api().bank.forEach(function(bq){ if(!dq430 && api().maskCount(bq.stmt) >= 4) dq430 = bq; });
  api().start('retry', {ids: [dq430.id]}); await wait(110);
  t('430 빈칸 4칸 이상 지문', qa('.stmt .bl').length >= 4, qa('.stmt .bl').length);
  t('430 빈칸 칸 수 안내', !!q('.blhint .blcnt'), (q('.blcnt') || {textContent:''}).textContent);
  t('430 빈칸 지문 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  api().HOME(); await wait(50);
  var ST10 = api().state;
  ST10.wrong = {}; ST10.rc = {};
  var w430 = api().bank.slice(700, 704);
  w430.forEach(function(bq, i){ ST10.wrong[bq.id] = {w: 1, last: Date.now(), res: 0}; if(i === 0) ST10.rc[bq.id] = {c: 'exc', at: Date.now()}; });
  api().HOME(); await wait(40);
  clickSel('button[data-act="wrong"]'); await wait(80);
  eq('430 필터 칩 7개', qa('.fchips .fchip').length, 7);
  t('430 오답노트 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1);
  clickSel('#themebtn'); await wait(40); clickSel('#themebtn'); await wait(60);
  eq('430 다크 모드', D().documentElement.getAttribute('data-theme'), 'dark');
  t('430 다크 오답노트 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1);
  clickSel('#themebtn'); await wait(40); clickSel('#themebtn'); await wait(50);
  api().HOME(); await wait(50);
  /* v18 — 430에서는 모드 칩이 한 줄로 서고, 카드가 홈 흐름을 밀어내지 않는다 */
  eq('430 빈칸 카드 모드 칩 3개', qa('.blindcard .bmodes .fchip').length, 3);
  var chipTop = qa('.blindcard .bmodes .fchip').map(function(b){ return Math.round(b.getBoundingClientRect().top); });
  t('430 모드 칩 한 줄', chipTop.length === 3 && (chipTop[0] === chipTop[1] && chipTop[1] === chipTop[2]), chipTop.join(','));
  t('430 빈칸 카드 넘침 없음', Math.max(D().documentElement.scrollWidth, D().body.scrollWidth) <= cw430 + 1,
    'scrollW=' + D().documentElement.scrollWidth);
  if(api().blindWordOn()){ clickSel('.blindcard .fchip[data-m="word"]'); await wait(70); }
  clickSel('.blindcard .fchip[data-m="word"]'); await wait(80);
  t('430 카드에서 핵심어 모드', api().blindWordOn() === true);
  t('430 카드 문구 갱신', (q('.blindcard .d') || {innerText: ''}).innerText.indexOf('가린 지문') >= 0,
    (q('.blindcard .d') || {innerText: ''}).innerText);
  api().HOME(); await wait(40);
  t('430 콘솔 오류 0건', (W().__errs || []).length === 0, JSON.stringify(W().__errs || []));
  FID = 'f360';
  summ();
}

async function suite(){
  var S;
  await wait(420);   /* 스플래시 사라질 시간 */

  log('sec', 'A. 홈 · 오늘 목표 게이지');
  t('앱이 그려졌다', q('#view').innerHTML.length > 500);
  t('스플래시가 사라졌다', q('#splash').classList.contains('off'));
  eq('제목', D().title, '세무사 1차 OX · 전과목');
  eq('과목 칩 5개', qa('.subjtabs button').length, 5);
  t('D-day 표시', /D-\d+/.test(body()), body().slice(0, 80));
  t('오늘 목표 게이지 있음', !!q('.goal .segs'));
  eq('목표 칸 10개', qa('.goal .segs i').length, 10);
  eq('처음엔 채워진 칸 0', qa('.goal .segs i.on').length, 0);
  t('남은 10문항 안내', body().indexOf('남은 10문항') >= 0);
  t('매일 10문항 고정 문구', body().indexOf('매일 10문항 고정') >= 0);
  t('약점 카드 있음', !!q('.weak') && !!q('.weak button[data-act="start-weak"]'));
  eq('퀵 액션 4개', qa('.quick .qbtn').length, 4);
  t('하단 데일리 버튼', !!q('#bar button[data-act="daily"]'));
  eq('처음 총 풀이 0', api().totals().n, 0);
  t('오늘은 아직 시작 전', body().indexOf('오늘은 아직 시작 전') >= 0);

  log('sec', 'B. 데일리 10문항 · 도트 · 즉시저장');
  clickSel('#bar button[data-act="daily"]');
  await wait(90);
  S = api().session();
  eq('데일리 세트 10문항', S.ids.length, 10);
  eq('화면 quiz', api().view().name, 'quiz');
  eq('도트 10개', qa('.dots i').length, 10);
  eq('현재 도트 1개', qa('.dots i.cur').length, 1);
  t('첫 문항 1 / 10', body().indexOf('1 / 10') >= 0);
  t('O/X 버튼', !!q('.pick.o') && !!q('.pick.x'));
  t('모르겠음 버튼', body().indexOf('모르겠음') >= 0);
  t('숫자 가리기 칩 기본 OFF', (q('.chip.blindc') || {className:''}).className.indexOf('on') < 0);
  var q1 = qOf(S.ids[0]);
  clickSel('.pick.' + (q1.answer === 'O' ? 'x' : 'o'));
  await wait(70);
  t('오답 판정', body().indexOf('오답입니다') >= 0);
  t('오답 원인 태그', !!q('.rcause'));
  eq('원인 태그 4개', qa('.rcause button').length, 4);
  eq('도트 빨강 1개', qa('.dots i.ng').length, 1);
  t('카운터 정답0·오답1', body().indexOf('정답 0 · 오답 1') >= 0);
  t('해설 핵심 이유', body().indexOf('핵심 이유') >= 0);
  t('내 메모 접힘', !!q('details.memo'));
  t('AI에게 묻기', body().indexOf('AI에게 묻기') >= 0);
  clickSel('.rcause button[data-c="num"]');
  await wait(60);
  eq('원인 태그 저장', (api().rc()[S.ids[0]] || {}).c, 'num');
  t('원인 태그 라벨 갱신', q('.rcause .lb').innerText.indexOf('숫자·기한') >= 0);
  clickSel('.rcause button[data-c="num"]');
  await wait(50);
  t('같은 태그 다시 → 해제', !api().rc()[S.ids[0]]);
  clickSel('.rcause button[data-c="exc"]');
  await wait(50);
  eq('다른 태그로 교체', (api().rc()[S.ids[0]] || {}).c, 'exc');

  clickSel('#bar button[data-act="next"]');
  await wait(50);
  var sawCombo = false;
  var seq = [true, true, false];
  for(var k = 0; k < 3; k++){
    var ss = api().session();
    var qq = qOf(ss.ids[ss.i]);
    var want = qq.answer;
    if(!seq[k]) want = (want === 'O' ? 'X' : 'O');
    clickSel('.pick.' + (want === 'O' ? 'o' : 'x'));
    await wait(45);
    if(api().session().combo >= 2 && body().indexOf('연속') >= 0) sawCombo = true;
    if(k < 2){ clickSel('#bar button[data-act="next"]'); await wait(45); }
  }
  t('연속 정답 콤보 표시', sawCombo, 'combo=' + api().session().combo);
  eq('최고 연속 2', api().session().best, 2);
  eq('도트 정답 2개', qa('.dots i.ok').length, 2);
  t('풀던 세션 저장', !!api().resume() && api().resume().ids.length === 10);
  clickSel('#bar button[data-act="next"]'); await wait(50);
  clickSel('#homebtn'); await wait(90);
  eq('헤더 ← 로 홈 복귀', api().view().name, 'home');
  t('데일리 이어서 버튼', q('#bar button[data-act="daily"]').innerText.indexOf('이어서') >= 0, q('#bar button[data-act="daily"]').innerText);
  eq('목표 게이지 4칸', qa('.goal .segs i.on').length, 4);
  clickSel('#bar button[data-act="daily"]'); await wait(70);
  eq('데일리 이어서 5번째 문항', api().session().i, 4);
  eq('복원 정답 수 2', api().session().ok, 2);
  t('복원 도트(정답2·오답2)', qa('.dots i.ok').length === 2 && qa('.dots i.ng').length === 2);

  for(var j = 0; j < 6; j++){
    var s2 = api().session();
    var q2 = qOf(s2.ids[s2.i]);
    clickSel('.pick.' + (q2.answer === 'O' ? 'o' : 'x'));
    await wait(40);
    clickSel('#bar button[data-act="next"]');

  t('카드에서 숫자 모드 켜짐', api().blindNumOn() === true);

    var wide = qa('#view *').filter(function(e){
      var r = e.getBoundingClientRect();

    }).map(function(e){ return (e.className || e.tagName) + ':' + Math.round(e.getBoundingClientRect().width); }).slice(0, 3);
    t(name + ' 요소 넘침 없음', wide.length === 0, wide.join(' | '));
  }
  api().HOME(); await wait(70); await overflowCheck('홈');
  clickSel('#statsbtn'); await wait(70); await overflowCheck('통계');
  clickSel('button[data-act="home"]'); await wait(50);
  clickSel('button[data-act="wrong"]'); await wait(60); await overflowCheck('오답노트');
  clickSel('button[data-act="home"]'); await wait(50);
  clickSel('button[data-act="rounds"]'); await wait(60); await overflowCheck('회차');
  clickSel('button[data-act="home"]'); await wait(50);
  clickSel('button[data-act="search"]'); await wait(60); await overflowCheck('검색');
  clickSel('button[data-act="home"]'); await wait(50);

  t('콘솔 오류 0건', (W().__errs || []).length === 0, JSON.stringify(W().__errs || []));
}

run().catch(function(e){

});
