<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>v15 진단</title>
<style>body{font:13px/1.45 system-ui;margin:10px} pre{white-space:pre-wrap;word-break:break-all;background:#f4f6fb;padding:10px;border-radius:8px}</style>
</head><body>
<pre id="out">준비 중…</pre>
<iframe id="f" width="390" height="844" style="border:0;position:absolute;left:-9999px"></iframe>
<script>
var P = [], started = false;
function say(s){ P.push(s); document.getElementById('out').textContent = P.join('\n'); }
try{ localStorage.removeItem('sebeop_ox_v1'); }catch(e){}
var f = document.getElementById('f');
f.onload = async function(){
  if(started) return; started = true;
  await new Promise(function(r){ setTimeout(r, 500); });
  var W = f.contentWindow, D = f.contentDocument, api = W.__sebeop;
  say('api: ' + !!api + ' bank: ' + (api ? api.bank.length : 0));
  var S = api.state;
  api.subjects.forEach(function(s){
    var pool = api.bank.filter(function(q){ return q.subject === s; }).slice(0, 12);
    pool.forEach(function(q, i){ S.att.push([q.id, i < 8 ? 10000 : (i < 10 ? 30000 : 100000), i < 8 ? 1 : 0]); });
  });
  say('att: ' + S.att.length + ' buckets all: ' + JSON.stringify(api.timeBuckets(null).map(function(b){ return b.lb + '=' + b.n + '/' + b.ok; })));
  say('sweet all: ' + JSON.stringify(api.timeSweet(api.timeBuckets(null))));
  say('paceFor: ' + api.paceForBucket(api.timeSweet(api.timeBuckets(null))));
  api.HOME();
  D.getElementById('statsbtn').click();
  await new Promise(function(r){ setTimeout(r, 150); });
  say('view: ' + JSON.stringify(api.view()));
  say('== chips: ' + Array.from(D.querySelectorAll('.tchip')).map(function(x){ return x.textContent.trim(); }).join(' | '));
  say('== pacebox: ' + JSON.stringify((D.querySelector('.pacebox') || {}).innerText));
  say('== tsweet: ' + JSON.stringify((D.querySelector('.tsweet') || {}).innerText));
  say('== tbrow: ' + Array.from(D.querySelectorAll('.tbrow')).map(function(x){ return x.textContent.trim(); }).join(' | '));
  say('== tsubj rows: ' + Array.from(D.querySelectorAll('.tsrow')).map(function(x){ return x.textContent.trim(); }).join(' | '));
  var chip = D.querySelector('.tchip[data-s="재정학"]'); if(chip) chip.click();
  await new Promise(function(r){ setTimeout(r, 150); });
  say('== after chip view: ' + JSON.stringify(api.view()));
  say('== 재정학 chip on: ' + JSON.stringify((D.querySelector('.tchip.on') || {}).textContent));
  say('== 재정학 pacebox: ' + JSON.stringify((D.querySelector('.pacebox') || {}).innerText));
  say('== 재정학 tsweet: ' + JSON.stringify((D.querySelector('.tsweet') || {}).innerText));
  say('== 재정학 표본줄: ' + JSON.stringify((D.querySelector('.card .tiny.muted') || {}).innerText));
  say('== 재정학 tbrow: ' + Array.from(D.querySelectorAll('.tbrow')).map(function(x){ return x.textContent.trim(); }).join(' | '));
  say('== errs: ' + JSON.stringify(W.__errs));
  api.HOME();
  // KEY 그룹이 낱말 가운데를 쪼개는 경우 — 앞 글자가 한글인 칸
  api.setBlind(false); api.setBlindWho(false); api.setBlindWord(true);
  var cnt = {}, ex = {};
  api.bank.forEach(function(q){
    var t0 = q.stmt, rs = api.maskRanges(t0);
    rs.forEach(function(r){
      var pv = t0.charAt(r.a - 1);
      if(r.a > 0 && /[가-힣]/.test(pv)){
        var key = pv + '|' + t0.slice(r.a, r.b);
        cnt[key] = (cnt[key] || 0) + 1;
        if(!ex[key]) ex[key] = t0.slice(Math.max(0, r.a - 12), Math.min(t0.length, r.b + 6));
      }
    });
  });
  var arr = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; });
  say('== 앞 글자 한글인 칸: ' + arr.length + '종');
  arr.slice(0, 25).forEach(function(k){ say('  ' + k + ' ×' + cnt[k] + '  ' + ex[k]); });
  say('== done');
};
f.src = '../index.html?qa=1&d=' + Date.now();
</script>
</body></html>
