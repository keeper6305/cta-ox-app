<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세무사 1차 OX · 전과목</title>
<meta name="description" content="세무사 1차 기출 선지 O/X 학습 앱 — 세법학개론·재정학·행정소송법·회계학개론 2,524지문, 과목별 데일리·오답노트·정답률 기록">
<meta name="theme-color" content="#101a33">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f8; --line:#dde3ee;
  --text:#111a2e; --muted:#667389; --primary:#2563eb; --primary-ink:#ffffff;
  --ok:#0f9d58; --ok-bg:#e7f7ee; --ng:#dc2626; --ng-bg:#fdeaea;
  --warn:#b45309; --warn-bg:#fef5e7; --shadow:0 2px 10px rgba(17,26,46,.07);
  --radius:18px; --tap:64px;
}
html[data-theme="dark"]{
  --bg:#0a0f1e; --surface:#141b2e; --surface2:#1c2540; --line:#25304d;
  --text:#e8edf7; --muted:#94a3b8; --primary:#3b82f6; --primary-ink:#06101f;
  --ok:#34d399; --ok-bg:#0f2e24; --ng:#f87171; --ng-bg:#34161a;
  --warn:#fbbf24; --warn-bg:#33270f; --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
body{
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain; touch-action:manipulation;
}
html{scroll-padding-top:72px; scroll-behavior:auto;}
/* overflow-x:hidden은 #app을 스크롤 상자로 만들어, 내용이 화면보다 길어지는 순간
   헤더·하단 버튼의 sticky가 통째로 꺼졌다(답안지처럼 긴 화면에서 ←·O/X가 사라짐).
   같은 효과를 내면서 스크롤 상자를 만들지 않는 clip으로 바꾼다. */
#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; overflow-x:clip;}
header#top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid transparent; transition:border-color .2s;
}
header#top.scrolled{border-bottom-color:var(--line);}
#brand{font-weight:800; letter-spacing:-.02em; font-size:1.02rem; display:flex; align-items:center; gap:7px; min-width:0;}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block;flex:none;}
#brand .sub{font-weight:700; font-size:.72rem; color:var(--muted);}
header#top .sp{flex:1;}
.iconbtn{
  width:40px;height:40px;min-width:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-size:17px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn:active{transform:scale(.96);}
main#view{flex:1; padding:6px 14px 18px; min-width:0;}
footer#bar{
  position:sticky; bottom:0; z-index:20; background:linear-gradient(to top,var(--bg) 72%,transparent);
  /* 호스팅 배지(ship.page)가 버튼을 가리지 않도록 하단 여유를 둔다 */
  padding:10px 14px calc(env(safe-area-inset-bottom) + 12px + 44px);
}
.menu .item, .li, .taxrow, .card, .stmt{scroll-margin-top:72px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
h2{font-size:1.06rem; margin:0 0 10px; letter-spacing:-.01em;}
h3{font-size:.95rem; margin:0 0 8px;}
p{margin:0 0 10px;} p:last-child{margin-bottom:0;}
.muted{color:var(--muted); font-size:.86rem;}
.tiny{font-size:.78rem;}
.row{display:flex; gap:10px; align-items:center;}
.spread{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:56px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-size:1.02rem; font-weight:700; font-family:inherit; cursor:pointer; padding:12px 16px;
}
.btn:active{transform:scale(.99);}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:44px; font-size:.9rem; border-radius:12px; width:auto; padding:8px 14px; font-weight:600;}
.btn.danger{color:var(--ng); border-color:var(--ng);}
.btn[disabled]{opacity:.45; pointer-events:none;}
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:.76rem; font-weight:700;
  padding:4px 9px; border-radius:999px; background:var(--surface2); color:var(--muted); white-space:nowrap;
}
.chip.tax{background:var(--primary); color:var(--primary-ink);}
.chip.subj{background:transparent; color:var(--text); border:1px solid var(--line);}
.chip.rev{background:var(--warn-bg); color:var(--warn);}
.chip.ok{background:var(--ok-bg); color:var(--ok);}
.chip.ng{background:var(--ng-bg); color:var(--ng);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; min-width:0;}
.stat b{display:block; font-size:1.16rem; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis;}
.stat span{font-size:.72rem; color:var(--muted);}
.menu{display:flex; flex-direction:column; gap:10px;}
.menu .item{
  display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:16px;
  background:var(--surface); border:1px solid var(--line); cursor:pointer; text-align:left; width:100%;
  font-family:inherit; color:var(--text);
}
.menu .item:active{background:var(--surface2);}
.menu .item .ico{font-size:1.35rem; line-height:1;}
.menu .item .t{font-weight:800; font-size:1rem;}
.menu .item .d{font-size:.8rem; color:var(--muted); font-weight:500;}
.menu .item .arrow{margin-left:auto; color:var(--muted);}

/* ── 과목 선택 탭 ── */
.subjtabs{
  display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 8px; margin:0 -2px 8px;
}
.subjtabs button{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:inherit; font-weight:800; font-size:.82rem; padding:8px 12px; border-radius:999px;
  cursor:pointer; white-space:nowrap;
}
.subjtabs button.on{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.subjtabs button .n{font-weight:700; font-size:.72rem; opacity:.75; margin-left:3px;}
.secttl{font-size:.78rem; font-weight:800; color:var(--muted); margin:12px 2px 8px; letter-spacing:.02em;}

/* ── 퀴즈 ── */
.qhead{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.bar{height:6px; border-radius:999px; background:var(--surface2); overflow:hidden; margin:2px 0 8px;}
.bar > i{display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .25s;}
.qcount{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-bottom:10px;}
.stmt{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px;
  font-size:1.19rem; line-height:1.72; font-weight:600; letter-spacing:-.01em; box-shadow:var(--shadow);
  word-break:keep-all;
}
.stmt .qmark{color:var(--primary); font-weight:900; margin-right:2px;}
details.origin{margin-top:10px; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden;}
details.origin > summary{
  list-style:none; padding:11px 14px; font-size:.85rem; font-weight:700; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
details.origin > summary::-webkit-details-marker{display:none;}
details.origin .body{padding:0 14px 14px; font-size:.92rem; line-height:1.7; color:var(--text); word-break:keep-all;}
.verdict{
  margin-top:14px; border-radius:16px; padding:14px 16px; font-weight:800; display:flex; align-items:center; gap:10px;
  font-size:1rem; border:1px solid transparent;
}
.verdict.good{background:var(--ok-bg); color:var(--ok); border-color:var(--ok);}
.verdict.bad{background:var(--ng-bg); color:var(--ng); border-color:var(--ng);}
.verdict .big{font-size:1.5rem; line-height:1;}
.exp{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px;}
.exp .sec + .sec{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.exp .lbl{font-size:.74rem; font-weight:800; color:var(--muted); letter-spacing:.04em; margin-bottom:4px;}
.exp .txt{font-size:.95rem; line-height:1.72; word-break:keep-all;}
.exp .arts{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.exp .sec.trap{background:var(--warn-bg, #fff8e6); border-radius:10px; padding:8px 10px; margin-top:10px; border-top:0;}
.exp .sec.trap .lbl{color:var(--warn, #b8860b);}
.exp .sec .txt br{line-height:1.9;}
.revcard{margin-top:12px; border:1px solid var(--warn); background:var(--warn-bg); border-radius:16px; padding:14px 16px; color:var(--text);}
.revcard .ttl{font-weight:800; color:var(--warn); font-size:.92rem; margin-bottom:8px;}
.revcard .k{font-size:.74rem; font-weight:800; color:var(--warn); margin:8px 0 2px;}
.revcard .v{font-size:.9rem; line-height:1.68; word-break:keep-all;}
footer#bar .picks{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pick{
  min-height:88px; border-radius:20px; border:2px solid var(--line); background:var(--surface);
  font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text);
}
.pick .glyph{font-size:2.1rem; font-weight:900; line-height:1;}
.pick .sub{font-size:.74rem; color:var(--muted); font-weight:700;}
.pick.o{border-color:var(--ok);} .pick.o .glyph{color:var(--ok);}
.pick.x{border-color:var(--ng);} .pick.x .glyph{color:var(--ng);}
.pick:active{transform:scale(.97);}
.pick.chosen{outline:3px solid var(--primary); outline-offset:2px;}
.pick.dim{opacity:.4;}

/* ── 목록 ── */
.list{display:flex; flex-direction:column; gap:10px;}
.li{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.li .q{font-size:.95rem; line-height:1.6; word-break:keep-all;}
.li .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;}
.li .acts{display:flex; gap:8px; margin-top:10px;}
.li .acts .btn{flex:1 1 0; min-width:0; width:auto; min-height:42px; font-size:.82rem; border-radius:10px; padding:8px 4px; white-space:nowrap;}
.tabs{display:flex; gap:6px; margin:4px 0 12px; background:var(--surface2); padding:4px; border-radius:12px;}
.tabs button{
  flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit; font-weight:800; font-size:.88rem;
  padding:9px 6px; border-radius:9px; cursor:pointer;
}
.tabs button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.taxrow{display:flex; align-items:center; gap:10px; padding:13px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;}
.taxrow > div{min-width:0;}
.taxrow .nm{font-weight:800; font-size:.95rem; word-break:keep-all;}
.taxrow .sub{font-size:.76rem; color:var(--muted);}
.taxrow .go{margin-left:auto; flex:none;}
.pbar{height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; margin-top:6px;}
.pbar > i{display:block; height:100%; background:var(--ok); border-radius:999px;}
.days7{display:flex; gap:6px; align-items:flex-end; height:74px;}
.days7 .d{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;}
.days7 .d .b{width:100%; background:var(--primary); border-radius:6px 6px 3px 3px; min-height:3px; opacity:.85;}
.days7 .d .lb{font-size:.64rem; color:var(--muted);}
.days7 .d .vl{font-size:.62rem; color:var(--muted); height:10px;}
#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 100px); transform:translate(-50%,20px);
  background:#111a2e; color:#fff; padding:11px 16px; border-radius:12px; font-size:.86rem; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:88vw; text-align:center;
}
#toast.on{opacity:1; transform:translate(-50%,0);}
#toast button{margin-left:10px; background:none; border:0; color:#7dd3fc; font-family:inherit; font-weight:800; font-size:.86rem; cursor:pointer;}
.nowrap{white-space:nowrap;}
.center{text-align:center;}
.sep{height:1px; background:var(--line); margin:14px 0;}
.banner{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px;
  background:var(--surface2); color:var(--muted); font-size:.82rem; line-height:1.55;
}
.banner .x{margin-left:auto; background:none; border:0; color:var(--muted); font-size:1rem; cursor:pointer; padding:0 2px;}

/* ═══════════ 2026 브랜드 리뉴얼 ═══════════ */
:root{
  --primary:#4f46e5; --primary-ink:#ffffff; --accent:#f59e0b;
  --hl:rgba(245,158,11,.42); --hl-chip:rgba(245,158,11,.22); --ring:rgba(79,70,229,.16);
  --shadow:0 4px 18px rgba(24,26,60,.08);
}
html[data-theme="dark"]{
  --primary:#8b8cf7; --primary-ink:#0b1020; --accent:#fbbf24;
  --hl:rgba(251,191,36,.26); --hl-chip:rgba(251,191,36,.27); --ring:rgba(139,140,247,.22);
}
body{font-feature-settings:"tnum" 1; letter-spacing:-.005em;}
h2{font-size:1.12rem; letter-spacing:-.03em;}
#brand{align-items:center;}
#brand .mk{width:24px;height:24px;flex:none;border-radius:7px;box-shadow:0 2px 6px rgba(79,70,229,.35);}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6d28d9); box-shadow:0 6px 16px rgba(79,70,229,.28); border-color:transparent;}
html[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#0b1020;}
.bar > i{background:linear-gradient(90deg,var(--primary),#8b5cf6);}

/* 히어로(오늘의 학습) */
.hero{
  position:relative; overflow:hidden; border-radius:22px; padding:18px 18px 16px; color:#fff;
  background:radial-gradient(120% 100% at 0% 0%, #6366f1 0%, #4f46e5 38%, #3730a3 72%, #241c6b 100%);
  box-shadow:0 14px 30px rgba(49,46,129,.32);
}
.hero::after{
  content:''; position:absolute; right:-56px; top:-70px; width:210px; height:210px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.26), rgba(255,255,255,0) 68%); pointer-events:none;
}
.hero .dday{font-size:.76rem; font-weight:800; letter-spacing:.02em; opacity:.92; display:flex; align-items:center; gap:6px;}
.hero .dday b{font-size:1rem; letter-spacing:-.02em;}
.hero h2{margin:4px 0 0; font-size:1.22rem; letter-spacing:-.035em; color:#fff;}
.hero .muted, .hero .tiny{color:rgba(255,255,255,.78);}
.hero .bar{background:rgba(255,255,255,.22); height:8px;}
.hero .bar > i{background:linear-gradient(90deg,#fff,#c7d2fe);}
.hero .tabs{background:rgba(255,255,255,.16);}
.hero .tabs button{color:rgba(255,255,255,.78);}
.hero .tabs button.on{background:rgba(255,255,255,.95); color:#312e81; box-shadow:none;}
.hero .streak{text-align:center; min-width:64px;}
.hero .streak b{display:block; font-size:1.5rem; letter-spacing:-.04em; line-height:1.1; white-space:nowrap;}
.hero .dday b{white-space:nowrap;}
@media (max-width: 380px){
  .hero{padding:16px 14px 14px;}
  .hero h2{font-size:1.04rem;}
  .hero .dday{font-size:.72rem;}
  .hero .dday .tiny{display:none;}
  .hero .streak{min-width:52px;}
  .hero .streak b{font-size:1.22rem;}
  .hero .tabs button{font-size:.82rem; padding:8px 2px;}
  .qbtn{padding:12px; min-height:80px;}
  .qbtn .t{font-size:.9rem;}
  .qbtn .d{font-size:.7rem;}
  .stmt{font-size:1.12rem;}
}

/* 퀵 액션 그리드 */
.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.qbtn{
  display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:left; min-height:84px;
  padding:14px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-family:inherit; cursor:pointer; box-shadow:var(--shadow);
}
.qbtn:active{transform:scale(.985);}
.qbtn .ic{font-size:1.2rem; line-height:1;}
.qbtn .t{font-weight:800; font-size:.94rem; letter-spacing:-.02em;}
.qbtn .d{font-size:.73rem; color:var(--muted); font-weight:600;}

/* 해설 하이라이트 — 조문·금액·용어를 단일 칩으로.
   굵기 800 + 반투명 그라데이션은 안드로이드 system-ui 폰트에서 § 글자가 뭉개지고
   줄마다 형광 띠 높이가 어긋나므로, 굵기 600 + 단색 배경 칩으로 고정한다. */
.hl{
  font-weight:600; color:inherit; background:var(--hl-chip);
  border-radius:5px; padding:1px 5px;
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
}

/* 스플래시 */
#splash{
  position:fixed; inset:0; z-index:95; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:radial-gradient(120% 90% at 18% 8%, #6366f1 0%, #4f46e5 30%, #312e81 68%, #1b1440 100%);
  color:#fff; transition:opacity .55s ease, visibility .55s ease;
}
#splash.off{opacity:0; visibility:hidden; pointer-events:none;}
#splash .logo{width:92px; height:92px; border-radius:26px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.4); animation:pop .75s cubic-bezier(.2,.9,.2,1) both;}
#splash .logo svg{display:block; width:100%; height:100%;}
#splash .t{font-weight:900; letter-spacing:-.04em; font-size:1.3rem; margin-top:6px;}
#splash .s{font-size:.8rem; opacity:.82; letter-spacing:.01em;}
#splash .ln{width:136px; height:4px; border-radius:99px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:8px;}
#splash .ln i{display:block; height:100%; width:42%; border-radius:99px; background:linear-gradient(90deg,#fff,#e0e7ff); animation:load 1.05s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-115%)}100%{transform:translateX(330%)}}
@keyframes pop{from{transform:scale(.84); opacity:0} to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){#splash .logo, #splash .ln i{animation:none}}

/* 검색 */
.searchbox{display:flex; gap:8px; margin:4px 0 12px;}
.searchbox input{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; background:var(--surface);
  color:var(--text); font-family:inherit; font-size:1rem; padding:12px 14px;
}
.searchbox input:focus{outline:2px solid var(--ring); border-color:var(--primary);}
.hitmark{background:var(--hl-chip); border-radius:4px; padding:1px 4px; font-weight:600;}

/* 답안지(회차 시험) */
.xrow{display:flex; flex-direction:column; gap:8px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface);}
.xrow .xq{display:flex; gap:8px; align-items:flex-start;}
.xrow .no{font-weight:900; color:var(--muted); font-size:.78rem; min-width:18px; padding-top:3px; flex:none;}
.xrow .q{font-size:.92rem; line-height:1.6; word-break:keep-all; flex:1; min-width:0;}
.xtgl{display:flex; gap:6px; flex:none; align-self:flex-end;}
.xtgl button{width:44px; height:36px;}
.xtgl button{
  width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2);
  color:var(--muted); font-family:inherit; font-weight:900; font-size:.95rem; cursor:pointer;
}
.xtgl button.on.o{border-color:var(--ok); color:var(--ok); background:var(--ok-bg);}
.xtgl button.on.x{border-color:var(--ng); color:var(--ng); background:var(--ng-bg);}
.xrow.right{border-color:color-mix(in srgb, var(--ok) 55%, var(--line));}
.xrow.wrong{border-color:color-mix(in srgb, var(--ng) 55%, var(--line));}

/* 메모 · 별표 */
.chip.star{cursor:pointer; font-family:inherit; border:1px solid var(--line); background:var(--surface);}
.chip.star.on{background:var(--hl); color:#7c4a03;}
html[data-theme="dark"] .chip.star.on{color:#fde68a;}
details.memo{margin-top:10px; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden;}
details.memo > summary{list-style:none; padding:11px 14px; font-size:.85rem; font-weight:700; color:var(--muted); cursor:pointer;}
details.memo > summary::-webkit-details-marker{display:none;}
details.memo .in{padding:0 12px 12px;}
details.memo textarea{
  width:100%; min-height:70px; border:1px solid var(--line); border-radius:12px; background:var(--surface2);
  color:var(--text); font-family:inherit; font-size:.92rem; line-height:1.6; padding:10px 12px; resize:vertical;
}

/* 완료 화면 링 */
.score{
  width:132px; height:132px; border-radius:50%; display:grid; place-items:center; margin:8px auto 12px;
  background:conic-gradient(var(--primary) calc(var(--p, 0) * 1%), var(--surface2) 0);
}
.score i{
  width:100px; height:100px; border-radius:50%; background:var(--surface); display:grid; place-items:center;
  font-style:normal; font-weight:900; font-size:1.55rem; letter-spacing:-.04em;
}

/* 이어서 풀기(중도 저장) 카드 */
.resume{
  display:flex; align-items:center; gap:10px; margin-top:12px; padding:12px 14px; border-radius:16px;
  background:var(--surface); border:1.5px solid var(--primary); box-shadow:var(--shadow);
}
.resume > div:first-child{min-width:0;}
.resume .t{font-weight:800; font-size:.92rem; letter-spacing:-.02em;}
.resume .d{font-size:.76rem; color:var(--muted); font-weight:600; margin-top:1px; word-break:keep-all;}
.resume .g{display:flex; gap:6px; flex:none; margin-left:auto;}
.resume .g .btn{white-space:nowrap;}
@media (max-width: 380px){
  .resume{padding:11px 12px; gap:8px;}
  .resume .t{font-size:.86rem;}
  .resume .d{font-size:.72rem;}
  .resume .g .btn{padding:7px 10px; font-size:.82rem;}
}

/* ═══════════ v11 · 학습 루프 강화 ═══════════ */
/* 오늘 목표 게이지 (히어로) */
.goal{margin-top:13px; padding-top:11px; border-top:1px solid rgba(255,255,255,.17);}
.goal .top{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.76rem; font-weight:800; color:rgba(255,255,255,.84);}
.goal .top .n{font-size:1.02rem; letter-spacing:-.03em; color:#fff;}
.goal .top .n em{font-style:normal; font-size:.76rem; opacity:.7; font-weight:700;}
.goal .segs{display:flex; gap:3px; margin-top:7px;}
.goal .segs i{flex:1 1 0; height:7px; border-radius:99px; background:rgba(255,255,255,.22); min-width:2px;}
.goal .segs i.on{background:linear-gradient(90deg,#fff,#dcd9ff);}
.goal .foot{display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:.71rem; color:rgba(255,255,255,.76);}
.badge-done{display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.2); color:#fff; border-radius:999px; padding:2px 9px; font-size:.7rem; font-weight:800;}

/* 진행 도트 · 콤보 */
.dots{display:flex; gap:4px; margin:2px 0 9px;}
.dots i{flex:1 1 0; height:6px; border-radius:99px; background:var(--surface2); min-width:2px; transition:background .18s;}
.dots i.ok{background:var(--ok);}
.dots i.ng{background:var(--ng);}
.dots i.cur{background:var(--primary); box-shadow:0 0 0 3px var(--ring);}
.qcount .rt{display:flex; align-items:center; gap:7px;}
.combo{font-weight:900; color:#d97706; font-size:.76rem; letter-spacing:-.01em;}
html[data-theme="dark"] .combo{color:var(--accent);}
.combo.hot{animation:pop2 .34s cubic-bezier(.2,.9,.2,1);}
@keyframes pop2{from{transform:scale(.78)} to{transform:scale(1)}}

/* 빈칸 훈련 — 숫자·기한 / 예외·요건 핵심어 가리기 */
.chip.blindc{font-family:inherit; cursor:pointer; border:1px solid var(--line); background:var(--surface);}
.chip.blindc.on{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.bl{background:var(--surface2); border-radius:4px; padding:0 4px; cursor:pointer; color:transparent; position:relative; user-select:none; -webkit-user-select:none;}
.bl::after{content:'?'; position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-weight:900; font-size:.8em;}
/* 핵심어는 길이가 제각각이라 폭을 고정한다 — 한 칸("하여야 한다")이 줄을 밀어내지 않게 */
.bl.key{display:inline-block; min-width:2.4em; padding:0 6px; border-radius:6px;}
/* 주체·권한은 색으로 구분한다 — 여러 항목을 같이 켜도 무엇을 가린 칸인지 보이게 */
.bl.who{display:inline-block; min-width:2.2em; padding:0 5px; border-radius:6px;
  box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--ct-who) 70%, transparent);}
/* 공개한 칸은 글자 흐름을 되돌린다 — inline-block의 최소 폭·좌우 여백이 남아 있으면
   "15일 [이내] 에" 처럼 조사가 떨어져 보인다. */
.bl.on{background:var(--hl-chip); color:inherit; display:inline; min-width:0; padding:0 1px; border-radius:4px;}
.bl.on::after{content:none;}
.blhint{margin-top:8px; font-size:.76rem; color:var(--muted);}

/* 빈칸 훈련 모드 고르개 — 칩 줄 아래 한 줄 */
.blindbar{
  margin:-2px 0 10px; padding:5px 5px 6px 7px;
  border:1px solid var(--line); border-radius:12px; background:var(--surface);
}
.blindbar .brow{display:flex; align-items:center; gap:6px;}
.blindbar .bcov{
  padding:6px 2px 0; font-size:.66rem; line-height:1.5; color:var(--muted);
  word-break:keep-all; font-variant-numeric:tabular-nums;
}
.blindbar .bsel{
  flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface2); color:var(--muted);
  font-family:inherit; font-weight:800; font-size:.73rem; padding:6px 4px; border-radius:9px; cursor:pointer; white-space:nowrap;
}
.blindbar .bsel.on{background:var(--warn-bg); color:var(--warn); border-color:var(--warn);}
.blindbar .bx{
  flex:0 0 auto; border:0; background:transparent; color:var(--muted);
  font-family:inherit; font-size:.92rem; line-height:1; padding:6px 6px; cursor:pointer;
}

/* 오답 원인 × 단원 교차 분석 */
:root{--ct-num:#f59e0b; --ct-who:#6366f1; --ct-exc:#0d9488; --ct-con:#e11d48;}
html[data-theme="dark"]{--ct-num:#fbbf24; --ct-who:#a5b4fc; --ct-exc:#5eead4; --ct-con:#fda4af;}
.cmatrix .mrow{padding:9px 0; border-top:1px dashed var(--line);}
.cmatrix .mrow:first-of-type{border-top:0; padding-top:0;}
.cmatrix .mlabel{display:flex; align-items:baseline; gap:6px; font-weight:800; font-size:.84rem; letter-spacing:-.01em; word-break:keep-all;}
.cmatrix .mlabel .nm{min-width:0;}
.cmatrix .mlabel .n{font-weight:700; font-size:.72rem; color:var(--muted); margin-left:auto; flex:none; white-space:nowrap;}
.cmatrix .cells{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-top:6px;}
.cmatrix .c{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-height:44px; padding:4px 2px; border-radius:9px; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted); font-family:inherit; font-size:.62rem; font-weight:800; letter-spacing:-.01em;
}
.cmatrix .c .v{font-size:.9rem; font-weight:900; line-height:1.1; color:var(--muted);}
.cmatrix .c.hit{
  cursor:pointer; border-color:transparent; color:var(--text);
  background:color-mix(in srgb, var(--c) var(--pc), transparent);
}
.cmatrix .c.hit .v{color:var(--text);}
.cmatrix .c.hit:active{transform:scale(.97);}
.cmatrix.insight, .cmatrix .insight{font-size:.78rem; color:var(--muted); margin:2px 0 10px; line-height:1.5; word-break:keep-all;}
.cmatrix .insight b{color:var(--text);}

/* 답안지 실전 페이스 */
.pacesel{display:flex; gap:5px; margin:0 0 10px;}
.pacesel button{
  flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:inherit; font-weight:800; font-size:.75rem; padding:9px 4px; border-radius:10px; cursor:pointer; white-space:nowrap;
}
.pacesel button.on{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
/* 답안지 보기 — 40문항을 훑을 때 미응답만 모아 본다 */
.xfilter{display:flex; gap:5px; margin:0 0 10px;}
.xfilter button{
  flex:1 1 0; min-width:0; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:inherit; font-weight:800; font-size:.75rem; padding:8px 4px; border-radius:10px; cursor:pointer;
}
.xfilter button.on{background:var(--surface2); color:var(--text); border-color:var(--text);}
.xfilter button:disabled{opacity:.45; cursor:default;}
.xms{font-size:.66rem; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums; align-self:center; flex:none;}
.xrow.hide{display:none;}
/* 결과 — 문항에 머문 시간 */
.slowrow{display:flex; align-items:center; gap:7px; padding:7px 0; border-top:1px dashed var(--line); font-size:.8rem;}
.slowrow:first-of-type{border-top:0;}
.slowrow .no{font-weight:900; color:var(--muted); min-width:18px; font-variant-numeric:tabular-nums;}
.slowrow .t{font-weight:900; font-variant-numeric:tabular-nums; min-width:44px;}
.slowrow .mk.ok{color:var(--ok);} .slowrow .mk.ng{color:var(--ng);}
.slowrow .q{flex:1; min-width:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pacebar{
  display:flex; flex-wrap:wrap; align-items:center; gap:3px 10px; margin:0 0 10px; padding:9px 12px;
  border-radius:12px; border:1px solid var(--line); background:var(--surface);
  font-size:.76rem; font-weight:700; color:var(--muted);
}
.pacebar .pv{font-weight:900; color:var(--text); font-variant-numeric:tabular-nums;}
.pacebar .pr{font-variant-numeric:tabular-nums;}
.pacebar.ok .pr{color:var(--ok);}
.pacebar.over .pr{color:var(--ng);}
.pacebar .pc{font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;}
.pacebar .pc.hot{color:var(--ng); font-weight:900;}
/* 현재 문항이 목표 시간을 넘겼을 때 — 색 변화에 더해 왼쪽 띠로 눈에 띄게 */
.pacebar.lapover{box-shadow:inset 3px 0 0 var(--ng), var(--shadow);}
.pacebar .pl{flex:1 1 100%; font-size:.7rem; font-weight:600; font-variant-numeric:tabular-nums;}
/* 답안지는 길어서 스크롤하는 동안에도 시간이 보여야 한다 — 헤더 바로 아래에 붙인다 */
.pacebar.sticky{position:sticky; top:calc(58px + env(safe-area-inset-top)); z-index:6; box-shadow:var(--shadow);}

/* 짧은 선지에는 발문을 붙여 맥락을 보여 준다 */
.stemctx{
  margin-bottom:8px; padding:9px 12px; border-left:3px solid var(--line); border-radius:0 10px 10px 0;
  background:var(--surface2); color:var(--muted); font-size:.82rem; line-height:1.55; word-break:keep-all;
}
.stemctx .lb{display:block; font-size:.68rem; font-weight:800; letter-spacing:.04em; color:var(--muted); opacity:.8; margin-bottom:2px;}

/* 오답 원인 태그 */
.rcause{margin-top:10px; padding:11px 12px; border:1px dashed var(--line); border-radius:14px; background:var(--surface);}
.rcause .lb{font-size:.76rem; font-weight:800; color:var(--muted); margin-bottom:8px; line-height:1.45; word-break:keep-all;}
.rcause .opts{display:flex; flex-wrap:wrap; gap:6px;}
.rcause button{
  border:1px solid var(--line); background:var(--surface); color:var(--text); font-family:inherit;
  font-size:.8rem; font-weight:700; padding:7px 11px; border-radius:999px; cursor:pointer; white-space:nowrap;
}
.rcause button.on{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.rcause button.sug{box-shadow:0 0 0 2px var(--ring);}
.causerow{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
.causerow .cr{display:flex; align-items:center; gap:7px; font-size:.8rem; font-weight:700; min-width:0;}
.causerow .bar2{flex:1 1 60px; height:7px; border-radius:99px; background:var(--surface2); overflow:hidden;}
.causerow .bar2 i{display:block; height:100%; border-radius:99px; background:var(--primary);}

/* 오늘의 약점 카드 */
.weak{display:flex; align-items:center; gap:11px; margin-top:12px; padding:13px 14px; border-radius:18px;
  border:1.5px solid var(--primary); background:var(--surface); box-shadow:var(--shadow);}
.weak .ico{font-size:1.25rem; line-height:1; flex:none;}
.weak .bd{min-width:0; flex:1;}
.weak .t{font-weight:800; font-size:.94rem; letter-spacing:-.02em;}
.weak .d{font-size:.75rem; color:var(--muted); font-weight:600; margin-top:1px; word-break:keep-all;}
.weak .btn{width:auto; flex:none; min-height:44px; white-space:nowrap; padding:8px 12px;}

/* 퀴즈 내용 세로 정렬 */
main#view.qz{display:flex; flex-direction:column;}
.qwrap{margin:auto 0; width:100%;}
.timeline{margin-top:10px; font-size:.78rem; color:var(--muted);}
/* 결과 화면 버튼 묶음 — .btn의 width:100%가 행 안에서 두 번째 버튼을 짜부러뜨리지 않게 */
.doneacts{display:flex; flex-direction:column; gap:8px;}
.doneacts .row .btn, #bar .row .btn{width:auto; flex:1 1 0; min-width:0;}
.topcta{margin-top:12px;}

/* ═══════════ v14 · 함정 대비어 · 취약 드릴 · 시간 분석 ═══════════ */
/* 대비어는 답을 고른 뒤에만 붙는다 — 문제 화면에서 미리 칠하면 정답 스포일러 */
.tw{
  background:var(--ng-bg); border-radius:4px; padding:0 3px; font-weight:800;
  box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--ng) 62%, transparent);
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
}
.traps{margin-top:12px; border:1px solid var(--line); border-radius:16px; padding:12px 14px; background:var(--surface);}
.traps .ttl{font-size:.82rem; font-weight:800; letter-spacing:-.01em;}
.traps .sub{font-size:.7rem; color:var(--muted); margin-top:2px; line-height:1.5; word-break:keep-all;}
.traps .tp{padding-top:8px; margin-top:8px; border-top:1px dashed var(--line);}
.traps .wr{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.traps .w{
  font-size:.76rem; font-weight:800; padding:2px 8px; border-radius:999px;
  background:var(--ng-bg); color:var(--ng); white-space:nowrap;
}
.traps .w.alt{background:var(--surface2); color:var(--muted);}
.traps .vs{font-size:.72rem; color:var(--muted); font-weight:800;}
.traps .tip{font-size:.72rem; color:var(--muted); margin-top:4px; line-height:1.55; word-break:keep-all;}

/* 취약 드릴 — 오답·모름·느린 문항을 한 세트로 */
.drillcard{
  display:flex; align-items:center; gap:10px; margin-top:12px; padding:12px 14px; border-radius:16px;
  border:1.5px solid var(--primary); background:var(--surface); box-shadow:var(--shadow);
}
.drillcard .bd{min-width:0; flex:1;}
.drillcard .t{font-weight:800; font-size:.92rem; letter-spacing:-.02em;}
.drillcard .t b{font-variant-numeric:tabular-nums;}
.drillcard .d{font-size:.73rem; color:var(--muted); font-weight:600; margin-top:2px; word-break:keep-all;}
.drillcard .btn{width:auto; flex:none; min-height:44px; white-space:nowrap; padding:8px 12px;}
/* 시간 × 정답률 */
.tbrow{display:flex; align-items:center; gap:8px; margin-top:7px;}
.tbrow .lb{flex:0 0 60px; font-size:.74rem; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
.tbrow .b2{flex:1 1 40px; height:8px; border-radius:99px; background:var(--surface2); overflow:hidden;}
.tbrow .b2 i{display:block; height:100%; border-radius:99px; background:var(--primary);}
.tbrow .n{flex:0 0 72px; text-align:right; font-size:.72rem; font-weight:800; font-variant-numeric:tabular-nums;}
.tbrow.dim .lb, .tbrow.dim .n{opacity:.5;}
</style>

function trapInline(html, cap){

function whoRanges(text){

  while((m = re.exec(text))){
    var key = m[0].replace(/\s+/g, '').replace('관할', '');
    if(seen[key]){ continue; }
    seen[key] = 1;
    out.push({a:m.index, b:m.index + m[0].length, kind:'who'});
    if(out.length >= WHO_CAP) break;
    if(m.index === re.lastIndex) re.lastIndex++;

}
/* 가릴 구간을 모아 한 번에 그린다 — 두 번 replace하면 먼저 넣은 태그를 다시 읽어 깨진다 */

  var text = String(s == null ? '' : s), out = [];
  if(blindWordOn()){
    var hits = [], m, re = new RegExp(KEY_RX.source, 'g');
    while((m = re.exec(text))){
      var pri = 0;
      for(var k = 1; k < m.length; k++){ if(m[k] !== undefined){ pri = k - 1; break; } }
      hits.push({a:m.index, b:m.index + m[0].length, pri:pri, kind:'key'});
      if(m.index === re.lastIndex) re.lastIndex++;
    }
    hits = dropContained(hits.concat(termHits(text)));   /* v14 — 개념어까지 한 사전에서 */
    if(hits.length > KEY_CAP){
      hits.sort(function(x, y){ return (x.pri - y.pri) || (x.a - y.a); });
      hits = hits.slice(0, KEY_CAP);
    }
    out = out.concat(hits);
  }
  if(blindWhoOn()){ out = out.concat(whoRanges(text)); }
  if(blindNumOn()){
    var m2, re2 = new RegExp(BL_RE.source, 'g');
    while((m2 = re2.exec(text))){
      if(m2[1]) continue;                    /* §81조의4 · 제16조 같은 조문 번호 */
      out.push({a:m2.index, b:m2.index + m2[0].length, kind:'num'});
    }

  out.sort(function(x, y){ return x.a - y.a; });
  /* 붙어 있는 칸은 한 칸으로 합친다 — "포함되지 아니한다"가 [?] [?]로 쪼개지지 않게 */

function maskHTML(s, reveal){
  var text = String(s == null ? '' : s);

  function plain(seg){ return reveal ? trapInline(esc(seg)) : esc(seg); }   /* 답한 뒤에만 대비어 표시 */
  sp.forEach(function(r){

    html += plain(text.slice(last, r.a)) +

var COV_CACHE = {};
function blindCoverage(){
  var sc = scope();
  if(COV_CACHE[sc]) return COV_CACHE[sc];
  var c = {total:0, num:0, key:0, who:0, any:0};
  for(var i = 0; i < BANK.length; i++){
    var q = BANK[i];
    if(!inScope(q)) continue;
    var t = String(q.stmt || '');
    c.total++;
    var hn = false, m, re1 = new RegExp(BL_RE.source, 'g');
    while((m = re1.exec(t))){ if(!m[1]){ hn = true; break; } if(m.index === re1.lastIndex) re1.lastIndex++; }
    var hk = new RegExp(KEY_RX.source).test(t) || termHits(t).length > 0;
    var hw = new RegExp(WHO_RX.source).test(t);
    if(hn) c.num++;
    if(hk) c.key++;
    if(hw) c.who++;
    if(hn || hk || hw) c.any++;
  }
  COV_CACHE[sc] = c;
  return c;
}

  return n > 0 ? 'D-' + n : (n === 0 ? 'D-DAY' : 'D+' + (-n));
}
/* ── 해설 하이라이트: 조문·금액·「용어」를 한 번의 패스로 감싼다 ──
   ① 단일 replace 1회 = 이미 넣은 <b> 태그를 다시 읽지 않으므로 중첩·깨진 태그가 생기지 않는다.
   ② 조문은 '§81의4·§81의9', '§81조의15', '§118조의9~17', '§47조의2①1',
      '제81조의4, 제81조의5'처럼 이어 붙은 것을 한 칩으로 묶는다.
   ③ §? 처럼 조문 번호가 확정되지 않은 표기는 건드리지 않는다(데이터 보완 대상). */
var ART_SUF = '(?:[①-⑳]\\d*)?(?:\\s?[~∼～]\\s?\\d+)?';
var ART_ONE = '(?:§\\s?\\d+\\s?조(?:\\s?의\\s?\\d+)?'      // §81조의15
            + '|§\\s?\\d+(?:\\s?의\\s?\\d+)?'               // §81의4 · §96
            + '|제\\s?\\d+\\s?조(?:\\s?의\\s?\\d+)?)'        // 제81조의4
            + ART_SUF;
var ART_SEP = '(?:\\s*[·ㆍ・‧∙,，/]\\s*|\\s*및\\s*)';
var HL_RE = new RegExp(
  '(' + ART_ONE + '(?:' + ART_SEP + ART_ONE + ')*'
  + '|\\d[\\d,.]*\\s?(?:억|만|천)?\\s?(?:원|%|％)'
  + '|「[^」]{1,24}」'
  + ')', 'g');
function hl(s){ return esc(s).replace(HL_RE, function(m){ return '<b class="hl">' + m + '</b>'; }); }
function nl2br(s){ return String(s).split('\n').map(function(l,i){ return i ? '<br>' + l : l; }).join(''); }
var SEARCH_IDX = null;
function searchIndex(){
  if(!SEARCH_IDX){
    SEARCH_IDX = BANK.map(function(q){
      return (q.stmt + ' ' + (q.why || '') + ' ' + (q.main || '') + ' ' + (q.trap || '') + ' ' + (q.src || '') + ' ' + (q.topic || '')).toLowerCase();
    });
  }
  return SEARCH_IDX;
}
function bookmarkCount(){ return Object.keys(S.book).length; }
function examPrompt(q){

    + '지문: ' + q.stmt + '\n\n'

    + '1) 왜 ' + q.answer + '인지 근거 조문과 조건을 설명해 주세요.\n'
    + '2) 이 지문에서 함정으로 바꾸기 쉬운 부분을 예시와 함께 짚어 주세요.';
}
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg); }catch(e){ toast('복사에 실패했습니다'); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  }else fallback();
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  var h = 2166136261;
  for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffle(arr, rnd){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function toast(msg, actionLabel, action){
  var el = document.getElementById('toast');
  /* 하단 버튼을 가리지 않게 푸터 높이를 재어 그 위에 띄운다 */
  var bar = document.getElementById('bar');
  var bh = bar ? Math.round(bar.getBoundingClientRect().height) : 0;
  el.style.bottom = (bh > 40 ? bh + 8 : 96) + 'px';
  el.innerHTML = esc(msg) + (actionLabel ? '<button type="button">' + esc(actionLabel) + '</button>' : '');
  if(actionLabel){
    el.querySelector('button').addEventListener('click', function(){ el.classList.remove('on'); action && action(); });
  }
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('on'); }, actionLabel ? 5200 : 2400);
}

/* ─────────── 통계 파생 ─────────── */
function totals(){
  var n = 0, ok = 0;
  for(var k in S.days){ n += S.days[k].n || 0; ok += S.days[k].ok || 0; }
  return {n:n, ok:ok, rate:pct(ok, n)};
}
function totalsOf(o){   /* 백업 파일 안의 기록으로 같은 집계를 낸다(불러오기 확인창용) */
  var n = 0;
  var days = (o && o.days) || {};
  for(var k in days){ n += days[k].n || 0; }
  return n;
}
function scopeTotals(){
  var n = 0, ok = 0;
  for(var id in S.ans){
    var q = byId.get(id); if(!q || !inScope(q)) continue;
    var a = S.ans[id]; n += a.n || 0; ok += a.o || 0;
  }
  return {n:n, ok:ok, rate:pct(ok, n)};
}
function subjectStats(){
  var o = {};
  SUBJECTS.forEach(function(s){ o[s] = {n:0, ok:0, seen:0, total:SUBJ_COUNT[s] || 0}; });
  for(var id in S.ans){
    var q = byId.get(id); if(!q) continue;
    var st = o[q.subject]; if(!st) continue;
    var a = S.ans[id]; st.n += a.n || 0; st.ok += a.o || 0; st.seen += 1;
  }
  SUBJECTS.forEach(function(s){ var x = o[s]; x.rate = pct(x.ok, x.n); x.cover = pct(x.seen, x.total); });
  return o;
}
function topicStats(subject){
  var o = {};
  (TOPICS[subject] || []).forEach(function(t){
    o[t] = {n:0, ok:0, seen:0, total:TOPIC_COUNT[subject + '|' + t] || 0, subject:subject};
  });
  for(var id in S.ans){
    var q = byId.get(id); if(!q || q.subject !== subject) continue;
    var st = o[q.topic]; if(!st) continue;
    var a = S.ans[id]; st.n += a.n || 0; st.ok += a.o || 0; st.seen += 1;
  }
  for(var t2 in o){ o[t2].rate = pct(o[t2].ok, o[t2].n); o[t2].cover = pct(o[t2].seen, o[t2].total); }
  return o;
}
/* ─────────── 약점 분석 ───────────
   ① 시도한 기록이 있는 단원 중 정답률이 낮은 곳을 먼저 본다(최소 3문항 이상).
   ② 아직 손대지 않은 단원이면 커버리지가 낮은 큰 단원부터.
   → 홈·통계에서 바로 10문항 집중 세트로 이어진다. */
function topicRows(){
  var subs = isAll() ? SUBJECTS : [scope()];
  var rows = [];
  subs.forEach(function(s){
    var ts = topicStats(s);
    (TOPICS[s] || []).forEach(function(t){
      var x = ts[t];
      rows.push({subject:s, topic:t, n:x.n, ok:x.ok, rate:x.rate, cover:x.cover, total:x.total});
    });
  });
  return rows;
}
function weakness(limit){
  var rows = topicRows();
  var tried = rows.filter(function(r){ return r.n >= 3; });
  tried.sort(function(a, b){ return (a.rate - b.rate) || (b.n - a.n) || (b.total - a.total); });
  var rest = rows.filter(function(r){ return r.n < 3; });
  rest.sort(function(a, b){ return (a.cover - b.cover) || (b.total - a.total); });
  var out = tried.concat(rest);
  return limit ? out.slice(0, limit) : out;
}
function weakLine(w){
  if(!w) return '';
  if(w.n >= 3) return shortName(w.subject) + ' · ' + w.topic + ' · ' + w.rate + '% 정답 (' + w.n + '문항)';
  return shortName(w.subject) + ' · ' + w.topic + ' · 아직 ' + w.total + '지문 남음';
}

function wrongList(onlyOpen){  var out = [];
  for(var id in S.wrong){
    var q = byId.get(id); if(!q || !inScope(q)) continue;
    var w = S.wrong[id];
    if(onlyOpen && w.res) continue;
    out.push({id:id, q:q, w:w});
  }
  out.sort(function(a, b){
    if(!!a.w.res !== !!b.w.res) return a.w.res ? 1 : -1;
    return (b.w.w - a.w.w) || (b.w.last - a.w.last);
  });
  return out;
}
function rounds(){
  var t = scopeTotals(), size = scopedSize() || 1;
  var seen = 0;
  for(var id in S.ans){ var q = byId.get(id); if(q && inScope(q)) seen++; }
  return {n: t.n / size, cover: seen, size: size, label: fmtRounds(t.n / size)};
}
function fmtRounds(v){
  if(v < 1) return v.toFixed(2);
  if(v < 10) return v.toFixed(1);
  return Math.round(v).toString();
}

/* ─────────── 중도 저장(풀다 나와도 이어서) ─────────── */
/* 한 문제를 푸는 순간 recordAnswer → snapshotSession → save()로 바로 디스크에 쓴다.
   세션(몇 번째 문항까지 풀었는지)도 같이 저장해 두었다가 홈에서 이어서 푼다. */
function sessionAnsweredN(s){
  var c = 0;
  ((s && s.ids) || []).forEach(function(id){ if(s.answered && s.answered[id] !== undefined) c++; });
  return c;
}
function snapshotSession(){
  if(!session || !session.ids || !session.ids.length || session.review || session.noResume){ S.resume = null; return; }
  var answered = {}, remain = 0;
  session.ids.forEach(function(id){
    if(session.answered[id] !== undefined) answered[id] = session.answered[id];
    else remain++;
  });
  S.resume = remain ? {mode:session.mode, ids:session.ids.slice(), i:session.i, answered:answered,
                       ok:session.ok || 0, subject:session.subject || null, topic:session.topic || null,
                       date:session.date || null, year:session.year || null, round:session.round || null,
                       at:Date.now()} : null;
}
function resumeRemain(){
  var r = S.resume; if(!r || !r.ids) return 0;
  var c = 0;
  r.ids.forEach(function(id){ if(byId.has(id) && r.answered[id] === undefined) c++; });
  return c;
}
function resumeAnswered(){
  var r = S.resume; if(!r || !r.ids) return 0;
  return sessionAnsweredN(r);
}
function resumeLabel(){
  var r = S.resume; if(!r) return '';
  return sessionLabel(r) + ' · ' + resumeAnswered() + ' / ' + (r.ids ? r.ids.length : 0) + ' 풀이';
}
function resumeQuiz(){
  var r = S.resume; if(!r || !r.ids) return;
  var ids = r.ids.filter(function(id){ return byId.has(id); });
  if(!ids.length){ S.resume = null; save(); render(); return; }
  var answered = {};
  ids.forEach(function(id){ if(r.answered[id] !== undefined) answered[id] = r.answered[id]; });
  var i = 0;
  while(i < ids.length && answered[ids[i]] !== undefined) i++;
  if(i >= ids.length) i = 0;
  session = {mode:r.mode || 'focus', ids:ids, i:i, answered:answered, ok:r.ok || 0,
             subject:r.subject || null, topic:r.topic || null, date:r.date || dkey(),
             year:r.year || null, round:r.round || null, startedAt:Date.now(), picked:null};
  navPush({name:'quiz'});
}

/* ─────────── 화면 이동 · 안드로이드 뒤로가기 2단계 종료 ─────────── */
/* 히스토리 구조: [기본 엔트리] › [가드] › 화면1 › 화면2 …
   - 화면을 열 때마다 pushState 한 칸.
   - 뒤로가기 1회 = 화면 스택 한 칸 되돌리기(모달·상세 우선 닫기).
   - 홈 루트에서 뒤로가기 1회 = 가드를 다시 세우고 토스트, 2초 안에 한 번 더면 종료. */
var HSTACK = [];
var BACK = {armedAt:0, jumping:false};
function initHistory(){
  try{
    if('scrollRestoration' in history) history.scrollRestoration = 'manual';
    history.replaceState({seb:'base'}, '');
    history.pushState({seb:'guard'}, '');
  }catch(e){ window.__errs.push('history: ' + e.message); }
}
function navPush(next){
  view = next;
  BACK.armedAt = 0;
  HSTACK.push({name:next.name, tab:next.tab, q:next.q});
  try{ history.pushState({seb:'v'}, ''); }catch(e){}
  render();
}
function navReplace(next){
  view = next;
  if(HSTACK.length) HSTACK[HSTACK.length - 1] = {name:next.name, tab:next.tab, q:next.q};
  try{ history.replaceState({seb:'v'}, ''); }catch(e){}
  render();
}
function navHome(){
  if(!HSTACK.length){ view = {name:'home'}; render(); return; }
  /* 화면은 곧바로 홈으로 — 히스토리 정리(history.go)는 뒤따라간다.
     popstate를 기다리면 누를 때마다 한 박자 늦게 바뀌어 보인다. */
  var n = HSTACK.length;
  BACK.jumping = true;
  HSTACK = [];
  view = {name:'home'};
  render();
  try{ history.go(-n); }catch(e){}
  setTimeout(function(){ BACK.jumping = false; }, 320);
}
function navTop(){
  var top = HSTACK.length ? HSTACK[HSTACK.length - 1] : {name:'home'};
  if((top.name === 'quiz' || top.name === 'done') && !session) top = {name:'home'};
  if((top.name === 'exam' || top.name === 'examresult') && !exam) top = {name:'home'};
  if(top.name !== 'quiz' && top.name !== 'done') session = null;
  view = {name:top.name, tab:top.tab, q:top.q};
  render();
}
function onBack(){
  if(BACK.jumping){                                 // 홈으로 한번에 돌아오는 중
    HSTACK = []; BACK.jumping = false;
    view = {name:'home'}; render();
    return;
  }
  var dets = document.querySelectorAll('#view details[data-backopen="1"][open]');
  if(dets.length){                                  // ① 사용자가 연 상세(원문·메모) 먼저 닫기
    var d = dets[dets.length - 1];
    d.removeAttribute('open'); d.removeAttribute('data-backopen');
    try{ history.pushState({seb:'v'}, ''); }catch(e){}
    return;
  }
  if(HSTACK.length){                                // ② 화면 스택 되돌리기
    if(view.name === 'quiz'){ snapshotSession(); save(); }
    HSTACK.pop();
    navTop();
    return;
  }
  var now = Date.now();                             // ③ 홈 루트: 두 번 눌러 종료
  if(BACK.armedAt && (now - BACK.armedAt) < 2000){
    BACK.armedAt = 0;
    try{ history.back(); }catch(e){}
    /* 브라우저 탭처럼 나갈 곳이 없어 그대로 남는 경우엔 가드를 다시 세운다 */
    setTimeout(function(){ try{ history.pushState({seb:'guard'}, ''); }catch(e){} }, 400);
    return;
  }
  BACK.armedAt = now;
  try{ history.pushState({seb:'v'}, ''); }catch(e){}
  toast('한 번 더 누르면 앱이 종료됩니다');
}
window.addEventListener('popstate', onBack);

/* ─────────── 세션 만들기 ─────────── */
function priorityOrder(list, rnd){
  var arr = shuffle(list, rnd);
  arr.sort(function(a, b){
    var A = S.ans[a.id], B = S.ans[b.id];
    var ua = A ? 0 : 1, ub = B ? 0 : 1;              // 미학습 우선
    if(ua !== ub) return ub - ua;
    return ((A && A.last) || 0) - ((B && B.last) || 0); // 오래된 것 우선
  });
  return arr;
}
function buildDaily(dateStr, n){
  var sc = scope();
  var rnd = mulberry32(hashStr('daily:' + dateStr + ':' + sc));
  var base = BANK.filter(function(q){ return inScope(q); });
  var open = wrongList(true);
  var picked = [], used = {}, usedQ = {};
  function qkey(q){ return q.subject + '|' + q.year + '|' + q.num; }
  function canTake(q){ return !used[q.id] && !usedQ[qkey(q)]; }
  function take(q){ picked.push(q.id); used[q.id] = 1; usedQ[qkey(q)] = 1; }
  var wantWrong = Math.min(open.length, Math.max(0, Math.round(n * 0.3)), Math.max(0, n - 1));
  for(var i = 0; i < open.length && picked.length < wantWrong; i++){
    if(canTake(open[i].q)) take(open[i].q);
  }
  var rest = n - picked.length;
  var pool = priorityOrder(base.filter(function(q){ return !used[q.id]; }), rnd);
  var keys = [];
  base.forEach(function(q){ var k = topicKey(q); if(keys.indexOf(k) < 0) keys.push(k); });
  var quota = {}, left = rest;
  keys.forEach(function(k){
    quota[k] = Math.min(Math.round(rest * (TOPIC_COUNT[k] || 0) / (base.length || 1)), left);
    left -= quota[k];
  });
  keys.forEach(function(k){
    var take2 = 0;
    for(var j = 0; j < pool.length && take2 < quota[k]; j++){
      if(topicKey(pool[j]) === k && canTake(pool[j])){ take(pool[j]); pool.splice(j, 1); j--; take2++; }
    }
  });
  // 같은 문항의 다른 선지는 한 세트에 넣지 않는다(중복 회피) — 빈자리는 같은 문항 허용
  for(var k2 = 0; k2 < pool.length && picked.length < n; k2++){
    if(!used[pool[k2].id] && !usedQ[qkey(pool[k2])]){ take(pool[k2]); }
  }
  for(var k3 = 0; k3 < pool.length && picked.length < n; k3++){
    if(!used[pool[k3].id]){ take(pool[k3]); }
  }
  return shuffle(picked, rnd);
}
function startSession(mode, opts){
  opts = opts || {};
  var ids = [], dateStr = dkey(), note = '';
  if(mode === 'daily'){
    var pk = planKey(dateStr);
    var plan = S.daily[pk];
    if(!plan || !plan.ids || !plan.ids.filter(function(id){ return byId.has(id); }).length){
      plan = {ids: buildDaily(dateStr, S.cfg.daily), done:{}, ok:0, at:Date.now(), scope:scope()};
      S.daily[pk] = plan; pruneDaily(); save();
    }
    ids = plan.ids.filter(function(id){ return byId.has(id); });
    dateStr = pk;
  }else if(mode === 'focus'){
    var n = opts.n || S.cfg.count;
    var rnd = mulberry32(hashStr('focus:' + opts.subject + ':' + opts.topic + ':' + dateStr + ':' + Object.keys(S.ans).length));
    var pool = BANK.filter(function(q){ return q.subject === opts.subject && q.topic === opts.topic; });
    ids = priorityOrder(pool, rnd).slice(0, n).map(function(q){ return q.id; });
    /* 단원 지문이 10개보다 적으면 같은 과목 다른 단원에서 모자란 만큼 더 넣는다(10문항 고정 유지) */
    if(ids.length < n){
      var usedF = {}; ids.forEach(function(id){ usedF[id] = 1; });
      var rndF = mulberry32(hashStr('focuspad:' + opts.subject + ':' + opts.topic + ':' + dateStr));
      var extra = BANK.filter(function(q){ return q.subject === opts.subject && q.topic !== opts.topic && !usedF[q.id]; });
      var fill = priorityOrder(extra, rndF).slice(0, n - ids.length);
      fill.forEach(function(q){ ids.push(q.id); });
      if(fill.length) note = '이 단원 지문이 ' + (ids.length - fill.length) + '개라 같은 과목 ' + fill.length + '문항을 더 넣었습니다';
    }
  }else if(mode === 'wrong'){
    var n2 = opts.n || 10;
    ids = wrongList(true).slice(0, n2).map(function(x){ return x.id; });
  }else if(mode === 'retry'){
    var want = (opts.ids || []).filter(function(id){ return byId.has(id); });
    if(want.length > 10){ note = '틀린 ' + want.length + '지문 중 10지문만 냅니다'; }
    ids = want.slice(0, 10);
  }else if(mode === 'drill'){
    var wantD = (opts.ids || []).filter(function(id){ return byId.has(id); });
    if(wantD.length > 10){ note = '취약 ' + wantD.length + '문항 중 10문항만 냅니다'; }
    ids = wantD.slice(0, 10);
  }else if(mode === 'book'){
    var poolB = BANK.filter(function(q){ return inScope(q) && S.book[q.id]; });
    var rndB = mulberry32(hashStr('book:' + dateStr + ':' + Object.keys(S.ans).length));
    ids = priorityOrder(poolB, rndB).map(function(q){ return q.id; });
    if(opts.n) ids = ids.slice(0, opts.n);
  }else if(mode === 'round'){
    ids = buildRoundIds(opts, opts.n || 0);
  }
  var answered = {};
  var i = 0, okInit = 0;
  if(mode === 'daily'){
    var p = S.daily[dateStr];
    ids.forEach(function(id){
      if(p.done[id] === undefined) return;
      answered[id] = p.done[id];
      var pq = byId.get(id);
      if(pq && p.done[id] === pq.answer) okInit++;
    });
    while(i < ids.length && answered[ids[i]] !== undefined) i++;
  }
  session = {mode:mode, ids:ids, i:i, answered:answered, ok:okInit,
             subject:opts.subject || null, topic:opts.topic || null, date:dateStr,
             year:opts.year || null, round:opts.round || null,
             startedAt:Date.now(), picked:null, noResume:!!opts.noResume,
             times:{}, combo:0, best:0, qStart:Date.now(), qStartFor:null, note:note};
  snapshotSession(); save();
  navPush({name:'quiz'});
}
/* 한 회차 = 문항당 지문 1개. 아직 안 푼 지문이 남은 문항을 번호 순으로 먼저, 남는 자리는 푼 문항에서. */
function buildRoundIds(opts, n){
  var pool = BANK.filter(function(q){ return q.subject === opts.subject && q.year === opts.year && q.round === opts.round; });
  var byNum = {}, nums = [];
  pool.forEach(function(q){
    if(!byNum[q.num]){ byNum[q.num] = []; nums.push(q.num); }
    byNum[q.num].push(q);
  });
  nums.sort(function(a, b){ return a - b; });
  var rnd = mulberry32(hashStr('round:' + opts.subject + ':' + opts.year + ':' + opts.round + ':' + Object.keys(S.ans).length));
  var out = [], rest = [];
  nums.forEach(function(num){
    var arr = byNum[num];
    var unseen = arr.filter(function(q){ return !S.ans[q.id]; });
    if(unseen.length){ out.push(unseen[Math.floor(rnd() * unseen.length)].id); }
    else { rest.push(arr); }
  });
  shuffle(rest, rnd).forEach(function(arr){
    out.push(arr[Math.floor(rnd() * arr.length)].id);
  });
  if(n > 0) out = out.slice(0, n);
  return out;
}
function pruneDaily(){
  var keys = Object.keys(S.daily).sort();
  while(keys.length > 60){ delete S.daily[keys.shift()]; }
}

/* ─────────── 답하기 ─────────── */
function recordAnswer(q, pick){
  var ok = (pick === q.answer);
  var a = S.ans[q.id] || (S.ans[q.id] = {n:0, o:0, x:0, last:0, lw:0});
  a.n++; a.last = Date.now();
  if(ok){ a.o++; } else { a.x++; a.lw = Date.now(); }
  var undo = null;
  if(!ok){
    var w = S.wrong[q.id] || (S.wrong[q.id] = {w:0, last:0, res:0});
    w.w++; w.last = Date.now(); w.res = 0;
    if(pick === '?') S.dnk[q.id] = Date.now();
  }else{
    if(S.dnk[q.id]) delete S.dnk[q.id];
    if(S.wrong[q.id] && !S.wrong[q.id].res){
      S.wrong[q.id].res = 1; S.wrong[q.id].last = Date.now(); undo = q.id;
    }
  }
  var ds = dkey();
  var d = S.days[ds] || (S.days[ds] = {n:0, ok:0});
  d.n++; if(ok) d.ok++;
  touchStreak(ds);
  return {ok:ok, undo:undo};
}
function answer(pick){
  if(!session) return;
  var q = byId.get(session.ids[session.i]);
  if(!q || session.answered[q.id] !== undefined) return;
  var r = recordAnswer(q, pick);
  session.answered[q.id] = pick;
  session.picked = pick;
  if(r.ok) session.ok++;
  /* 문항 소요 시간 — 실제 시험은 시간 싸움이라 평균 페이스를 보여 준다 */
  var spent = Date.now() - (session.qStart || Date.now());
  if(spent > 500 && spent < 900000){
    session.times[q.id] = spent;
    S.spd = S.spd || {n:0, ms:0};
    S.spd.n = (S.spd.n || 0) + 1; S.spd.ms = (S.spd.ms || 0) + spent;
    logAtt(q.id, spent, r.ok);
  }
  /* 연속 정답 */
  if(r.ok){ session.combo = (session.combo || 0) + 1; session.best = Math.max(session.best || 0, session.combo); }
  else session.combo = 0;
  if(session.mode === 'daily'){
    var plan = S.daily[session.date] || (S.daily[session.date] = {ids:session.ids, done:{}, ok:0});
    plan.done[q.id] = pick; if(r.ok) plan.ok = (plan.ok || 0) + 1;
  }
  /* 문항마다 바로 저장 — 중간에 나거나 앱이 꺼져도 여기까지가 기록·진도·오답에 남는다 */
  snapshotSession();
  save(); render();
  if(r.undo) toast('오답노트에서 해결됨으로 옮겼습니다', '되돌리기', function(){
    if(S.wrong[r.undo]){ S.wrong[r.undo].res = 0; save(); render(); }
  });
}
/* ─────────── v14 · 문항별 소요 시간 기록 ───────────
   문항 하나에 머문 시간을 정답과 함께 짧게 남긴다(최근 600개).
   → “어느 속도에서 맞히는지”(시간×정답률)와 “느린 문항”(취약 드릴)의 재료가 된다. */
function logAtt(id, ms, ok){
  if(!(ms > 500 && ms < 900000)) return;
  S.att = S.att || [];
  S.att.push([id, Math.round(ms), ok ? 1 : 0]);
  if(S.att.length > 600) S.att = S.att.slice(-600);
}
function touchStreak(ds){
  var st = S.streak;
  if(st.last === ds) return;
  var y = addDays(-1);
  st.cur = (st.last === y) ? (st.cur || 0) + 1 : 1;
  st.last = ds;
  st.best = Math.max(st.best || 0, st.cur);
}
function nextQ(){
  if(!session) return;
  session.i++;
  session.picked = null;
  if(session.i >= session.ids.length){ S.resume = null; save(); navReplace({name:'done'}); return; }
  snapshotSession(); save(); render();
}

/* ─────────── 회차 답안지(시험 모드) ─────────── */
var exam = null, examResult = null;
/* 실전 페이스 — 문항당 60·90초를 기준으로 “지금까지 쓴 시간”과 “그만큼 풀었어야 할 시간”을 나란히 보여 준다.
   시험은 시간 감각이 절반이라 채점 전에 스스로 페이스를 잡게 한다. 끄면 시간을 표시하지 않는다. */
function fmtClock(ms){
  var s = Math.max(0, Math.round((ms || 0) / 1000));
  var m = Math.floor(s / 60); s = s % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
/* 1분 미만은 초로 — "문항당 0:41"보다 "문항당 41초"가 읽기 좋다 */
function fmtDur(ms){
  var s = Math.max(0, Math.round((ms || 0) / 1000));
  if(s < 60) return s + '초';
  var m = Math.floor(s / 60), r = s % 60;
  return m + '분' + (r ? ' ' + r + '초' : '');
}
function paceState(){
  var e = exam, per = parseInt(S.cfg.pace, 10) || 0;
  if(!e || !per) return null;
  var ansd = 0, cur = -1;
  (e.items || []).forEach(function(it, i){ if(it.pick){ ansd++; } else if(cur < 0){ cur = i; } });
  if(cur < 0) cur = Math.max(0, (e.items || []).length - 1);
  var el = Date.now() - (e.at || Date.now());
  var lap = Math.max(0, Date.now() - (e.lapAt || e.at || Date.now()));
  var base = Math.max(1, ansd);            /* 답한 문항만큼의 예산(첫 문항은 1문항 예산) */
  var rec = base * per * 1000;
  return {per:per, ansd:ansd, total:(e.items || []).length, el:el, rec:rec, diff:el - rec,
          left:((e.items || []).length - ansd) * per * 1000,
          lap:lap, cur:cur, overLap:lap > per * 1000};
}
function paceInner(p){
  if(!p) return '';
  var over = p.diff > 0;
  return '<span class="pv">⏱ ' + fmtClock(p.el) + '</span>' +
    '<span class="pr">권장 ' + fmtClock(p.rec) + ' (' + Math.max(1, p.ansd) + '문항) · ' +
      (over ? fmtClock(p.diff) + ' 느림' : fmtClock(-p.diff) + ' 여유') + '</span>' +
    '<span class="pc' + (p.overLap ? ' hot' : '') + '">' + (p.cur + 1) + '번 ' + fmtClock(p.lap) + ' / ' + p.per + '초</span>' +
    '<span class="pl">답함 ' + p.ansd + ' / ' + p.total + ' · 남은 ' + (p.total - p.ansd) + '문항 ≈ ' + fmtClock(p.left) + '</span>';
}
function paceHTML(){
  var p = paceState();
  if(!p) return '';
  return '<div class="pacebar sticky ' + (p.diff > 0 ? 'over' : 'ok') + '" id="pacebar">' + paceInner(p) + '</div>';
}
function tickPace(){
  var el = document.getElementById('pacebar');
  if(!el || !exam) return;
  var p = paceState();
  if(!p) return;
  el.className = 'pacebar sticky ' + (p.diff > 0 ? 'over' : 'ok') + (p.overLap ? ' lapover' : '');
  el.innerHTML = paceInner(p);
  /* 한 문항에 목표 시간을 넘겼을 때만, 5문항에 한 번꼴로 알린다 — 매 문항 토스트는 방해가 된다 */
  var last = (typeof exam.warnedAt === 'number') ? exam.warnedAt : -5;
  if(p.overLap && !document.hidden && p.ansd < p.total && p.ansd - last >= 5){
    exam.warnedAt = p.ansd;
    toast('⏱ ' + (p.cur + 1) + '번 문항에 ' + fmtDur(p.lap) + ' — ' + p.per + '초 페이스를 넘겼어요. 골라 두고 넘어가세요');
  }
}
function startExam(subject, year, round){
  var ids = buildRoundIds({subject:subject, year:year, round:round}, 0);
  if(!ids.length){ toast('이 회차에 지문이 없습니다'); return; }
  exam = {subject:subject, year:year, round:round, items:ids.map(function(id){ return {id:id, pick:null, ok:null}; }), at:Date.now(), lapAt:Date.now(), only:0};
  /* 같은 회차 답안지를 풀다 나갔다면 골라 둔 O/X를 되살린다(걸린 시간도 이어진다) */
  var d = S.exdraft;
  if(d && d.subject === subject && d.year === year && d.round === round && d.items){
    var saved = {};
    d.items.forEach(function(it){ if(it.pick) saved[it.id] = it; });
    exam.items.forEach(function(it){ var sv = saved[it.id]; if(sv){ it.pick = sv.pick; it.ms = sv.ms || 0; } });
    if(d.at) exam.at = d.at;
    /* 다시 들어온 순간부터 문항 시간을 잰다(쉬는 동안 시간이 쌓여 바로 초과 알림이 뜨지 않게) */
    exam.lapAt = Date.now();
  }
  session = null;
  navPush({name:'exam'});
}

function paintExamRow(i){
  if(!exam) return;

  btns[1].className = (it.pick === 'X' ? 'on x' : '');
  /* 페이스를 켜 두었다면 그 문항에 걸린 시간을 O/X 옆에 남긴다 */

function submitExam(){
  if(!exam) return;
  var ok = 0, done = 0;
  exam.items.forEach(function(it){
    if(!it.pick) return;
    var q = byId.get(it.id);
    var r = recordAnswer(q, it.pick);
    it.ok = r.ok; done++; if(r.ok) ok++;
    logAtt(it.id, it.ms || 0, r.ok);
  });
  exam.ok = ok; exam.done = done;
  S.exdraft = null; save();
  examResult = exam;
  navReplace({name:'examresult'});
}
function renderExamResult(v, b){
  var e = examResult;
  if(!e){ HSTACK = []; view = {name:'home'}; render(); return; }

  var eids = wrongIds.map(function(it){ return it.id; });
  var spent = Date.now() - (e.at || Date.now());
  var perItem = e.done ? spent / e.done : 0;

  var timeHTML = (spent > 6 * 3600 * 1000) ? '' :
    '<div class="muted tiny" style="margin-top:6px">⏱ 시작부터 ' + fmtClock(spent) +

  var timed = e.items.map(function(it, i){ return {i:i, ms:it.ms || 0, ok:it.ok}; })

  var avgMs = timed.length ? timed.reduce(function(a, x){ return a + x.ms; }, 0) / timed.length : 0;

      }).join('') +

  v.innerHTML =

                             : '왜 틀렸나요? 하나만 골라 두면 내 약점 통계가 됩니다') + '</div>' +
    '<div class="opts">' + CAUSE_ORDER.map(function(c){
      return '<button type="button" data-act="rcause" data-c="' + c + '" class="' +
        (cur === c ? 'on' : '') + (cur ? '' : (c === sug ? ' sug' : '')) + '">' + CAUSE[c] + '</button>';
    }).join('') + '</div></div>';
}
function causeCounts(){
  var o = {num:0, who:0, exc:0, con:0};
  var src = S.rc || {};
  for(var id in src){
    var c = src[id] && src[id].c;
    if(c && o[c] !== undefined && byId.has(id) && inScope(byId.get(id))) o[c]++;
  }
  return o;
}
/* 원인 × 단원 교차 — "이 단원에서는 무엇에 걸리는지"를 한 칸씩 세어 둔다 */
function causeByTopic(){
  var rows = {}, src = S.rc || {};
  for(var id in src){
    var c = src[id] && src[id].c;
    if(!c || !CAUSE[c]) continue;
    var q = byId.get(id);
    if(!q || !inScope(q)) continue;
    var k = q.subject + '|' + q.topic;
    var r = rows[k] || (rows[k] = {subject:q.subject, topic:q.topic, counts:{num:0,who:0,exc:0,con:0}, total:0});
    r.counts[c]++; r.total++;
  }
  var out = [];
  for(var k2 in rows) out.push(rows[k2]);
  out.sort(function(a, b){ return (b.total - a.total) || (a.topic < b.topic ? -1 : 1); });
  return out;
}
function causeTop(r){
  var best = null;
  CAUSE_ORDER.forEach(function(c){
    var n = r.counts[c] || 0;
    if(!best || n > best.n) best = {c:c, n:n};
  });
  return (best && best.n) ? best : null;
}
/* 단원별 주된 원인 맵 — 약점 TOP 5 날줄에 바로 붙인다 */
function causeTopMap(){
  var m = {};
  causeByTopic().forEach(function(r){
    var t = causeTop(r);
    if(t) m[r.subject + '|' + r.topic] = {c:t.c, n:t.n, total:r.total};
  });
  return m;
}

/* ─────────── v14 · 취약 드릴 · 시간 × 정답률 ───────────
   AdaptiBar의 Timing Analysis처럼 “몇 초에 풀 때 맞히는지”를 보고, 틀린 것·모르는 것·
   오래 붙잡은 것을 한 버튼으로 모아 준다(세트는 10문항까지, 겹치는 문항은 한 번만). */
function paceRef(){
  var p = parseInt(S.cfg.pace, 10) || 0;
  return p || 60;          /* 페이스를 끈 상태면 1차 시험 기준 60초를 기준으로 본다 */
}
function timeBuckets(){
  var defs = [[0, 20, '~20초'], [20, 40, '20~40초'], [40, 60, '40~60초'], [60, 90, '60~90초'], [90, 1e9, '90초~']];
  var out = defs.map(function(d){ return {lo:d[0], hi:d[1], lb:d[2], n:0, ok:0}; });
  (S.att || []).forEach(function(a){
    if(!a || !(a[1] > 0)) return;
    var q = byId.get(a[0]);
    if(!q || !inScope(q)) return;
    var sec = a[1] / 1000;
    for(var i = 0; i < out.length; i++){
      if(sec < out[i].hi || i === out.length - 1){ out[i].n++; if(a[2]) out[i].ok++; break; }
    }
  });
  return out;
}
function timeCardHTML(){
  var bs = timeBuckets(), n = 0;
  bs.forEach(function(b){ n += b.n; });
  var head = '<div class="card" style="margin-top:12px"><h3>⏱ 시간 × 정답률</h3>';
  if(n < 12){
    return head + '<p class="muted tiny">시간 기록이 ' + n + '개입니다. 10문항만 더 풀면 어느 속도에서 정답률이 높은지 보여 드립니다.</p>' +
      '<p class="muted tiny" style="margin-top:6px">문항 소요는 지문을 띄운 순간부터 O/X를 누를 때까지 재어 둡니다.</p></div>';
  }
  var sweet = null;
  bs.forEach(function(b){ if(b.n >= 3 && (!sweet || pct(b.ok, b.n) > pct(sweet.ok, sweet.n))) sweet = b; });
  var fast = {n:0, ok:0}, slow = {n:0, ok:0};
  bs.forEach(function(b){ var t = (b.hi <= 60) ? fast : slow; t.n += b.n; t.ok += b.ok; });
  var cmp = (fast.n && slow.n)
    ? '60초 넘긴 문항 <b>' + pct(slow.ok, slow.n) + '%</b> · 60초 이내 <b>' + pct(fast.ok, fast.n) + '%</b>'
    : '';
  return head +
    (sweet ? '<p class="tiny" style="margin-bottom:6px">가장 정답률이 높은 구간 — <b>' + esc(sweet.lb) + '</b> (' + pct(sweet.ok, sweet.n) + '%, ' + sweet.n + '문항)</p>' : '') +
    bs.map(function(b){
      var r = b.n ? pct(b.ok, b.n) : 0;
      return '<div class="tbrow' + (b.n ? '' : ' dim') + '"><span class="lb">' + esc(b.lb) + '</span>' +
        '<span class="b2"><i style="width:' + (b.n ? Math.max(4, r) : 0) + '%"></i></span>' +
        '<span class="n">' + (b.n ? r + '% · ' + b.n : '–') + '</span></div>';
    }).join('') +
    (cmp ? '<p class="tiny muted" style="margin-top:8px">' + cmp + '</p>' : '') +
    '</div>';
}
function drillInfo(){
  var pace = paceRef(), map = {}, order = [];
  function touch(id){
    if(!map[id]){ map[id] = {id:id, wrong:0, dnk:0, slow:0, ms:0, n:0, last:0}; order.push(id); }
    return map[id];
  }
  wrongList(true).forEach(function(x){ var o = touch(x.id); o.wrong = x.w.w || 1; o.last = x.w.last || 0; });
  for(var id in S.dnk){
    var q = byId.get(id);
    if(q && inScope(q)) touch(id).dnk = 1;
  }
  (S.att || []).forEach(function(a){
    if(!a || !(a[1] > pace * 1000)) return;
    var q2 = byId.get(a[0]);
    if(!q2 || !inScope(q2)) return;
    var o2 = touch(a[0]); o2.slow++; o2.ms += a[1]; o2.n++;
  });
  var items = order.map(function(id){ return map[id]; });
  items.sort(function(x, y){
    var sx = x.wrong * 100 + x.dnk * 30 + Math.min(9, x.slow) * 5;
    var sy = y.wrong * 100 + y.dnk * 30 + Math.min(9, y.slow) * 5;
    return (sy - sx) || (y.wrong - x.wrong) || (y.last - x.last);
  });
  var c = {wrong:0, dnk:0, slow:0};
  items.forEach(function(x){ if(x.wrong) c.wrong++; if(x.dnk) c.dnk++; if(x.slow) c.slow++; });
  return {items:items.slice(0, 10), total:items.length, wrong:c.wrong, dnk:c.dnk, slow:c.slow, pace:pace};
}
function drillCardHTML(){
  var d = drillInfo();
  if(!d.total) return '';
  var bits = [];
  if(d.wrong) bits.push('오답 ' + d.wrong);
  if(d.dnk) bits.push('모름 ' + d.dnk);
  if(d.slow) bits.push(d.pace + '초 초과 ' + d.slow);
  return '<div class="drillcard"><div class="bd">' +
    '<div class="t">🎯 취약 드릴 <b>' + d.items.length + '문항</b></div>' +
    '<div class="d">' + bits.join(' · ') +
      (d.total > d.items.length ? ' — 한 세트는 10문항까지' : ' — 겹치는 문항은 한 번만') + '</div></div>' +
    '<button class="btn sm primary" type="button" data-act="start-drill">드릴 시작</button></div>';
}

function sessionLabel(s){
  if(!s) return '';
  if(s.mode === 'daily') return scopeLabel() + ' 데일리';
  if(s.mode === 'focus') return shortName(s.subject || '') + ' · ' + (s.topic || '') + ' 집중';
  if(s.mode === 'round') return shortName(s.subject || '') + ' · ' + (s.year || '') + ' ' + (s.round || '') + ' 기출';
  if(s.mode === 'retry') return '틀린 지문 다시';
  if(s.mode === 'drill') return '취약 문항 드릴';
  if(s.mode === 'book') return '북마크';
  return '오답 집중';
}

function renderDone(v, b){
  var s = session || {ids:[], ok:0, answered:{}, mode:'daily'};
  var total = s.ids.length, done = Object.keys(s.answered).length;
  var rate = pct(s.ok, total);
  var open = wrongList(true);
  var msg = s.mode === 'wrong'
      ? (rate >= 80 ? '오답 지문을 거의 다 해결했습니다.' : '아직 헷갈리는 지문이 남아 있습니다. 해설을 한 번 더 읽어 보세요.')
      : s.mode === 'retry'
      ? (rate >= 90 ? '틀린 지문을 거의 다 잡혔습니다.' : '아직 남은 것이 있습니다. 아래에서 한 번 더 돌려 보세요.')
      : s.mode === 'round'
      ? (rate >= 80 ? '이 회차는 거의 잡혔습니다. 다른 회차로 넘어가 보세요.'
        : '이 회차에서 틀린 지문은 오답노트에 쌓였습니다. 회차별 풀기로 한 번 더 돌려 보세요.')
      : (rate >= 90 ? '아주 좋습니다. 이 단원은 거의 잡혔어요.'

  var wIds = Object.keys(s.answered).filter(function(id){ return s.answered[id] !== (byId.get(id) || {}).answer; });
  var ts = 0, tn = 0;
  for(var tk in (s.times || {})){ ts += s.times[tk]; tn++; }
  var pace = tn ? Math.round(ts / tn / 1000) : 0;
  var metaBits = [];

  v.innerHTML =
    '<div class="card center" style="margin-top:16px">' +

      '<div class="muted">' + done + '문항 중 ' + s.ok + '문항 정답 · 오답 ' + (done - s.ok) + '</div>' +
      (metaBits.length ? '<div class="tiny muted" style="margin-top:6px">' + metaBits.join(' · ') + '</div>' : '') +
      (s.note ? '<div class="tiny muted" style="margin-top:6px">' + esc(s.note) + '</div>' : '') +
      '<p class="muted" style="margin-top:10px">' + msg + '</p>' +
