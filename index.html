<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세무사 1차 OX · 전과목</title>
<meta name="description" content="세무사 1차 기출 선지 O/X 학습 앱 — 세법학개론·재정학·행정소송법·회계학개론 2,524지문, 과목별 데일리·오답노트·정답률 기록">
<meta name="theme-color" content="#101a33">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#eef1f8; --line:#dde3ee;
  --text:#111a2e; --muted:#667389; --primary:#2563eb; --primary-ink:#ffffff;
  --ok:#0f9d58; --ok-bg:#e7f7ee; --ng:#dc2626; --ng-bg:#fdeaea;
  --warn:#b45309; --warn-bg:#fef5e7; --shadow:0 2px 10px rgba(17,26,46,.07);
  --radius:18px; --tap:64px;
}
html[data-theme="dark"]{
  --bg:#0a0f1e; --surface:#141b2e; --surface2:#1c2540; --line:#25304d;
  --text:#e8edf7; --muted:#94a3b8; --primary:#3b82f6; --primary-ink:#06101f;
  --ok:#34d399; --ok-bg:#0f2e24; --ng:#f87171; --ng-bg:#34161a;
  --warn:#fbbf24; --warn-bg:#33270f; --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
body{
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain; touch-action:manipulation;
}
html{scroll-padding-top:72px; scroll-behavior:auto;}
#app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;}
header#top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid transparent; transition:border-color .2s;
}
header#top.scrolled{border-bottom-color:var(--line);}
#brand{font-weight:800; letter-spacing:-.02em; font-size:1.02rem; display:flex; align-items:center; gap:7px; min-width:0;}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block;flex:none;}
#brand .sub{font-weight:700; font-size:.72rem; color:var(--muted);}
header#top .sp{flex:1;}
.iconbtn{
  width:40px;height:40px;min-width:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-size:17px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn:active{transform:scale(.96);}
main#view{flex:1; padding:6px 14px 18px; min-width:0;}
footer#bar{
  position:sticky; bottom:0; z-index:20; background:linear-gradient(to top,var(--bg) 72%,transparent);
  /* 호스팅 배지(ship.page)가 버튼을 가리지 않도록 하단 여유를 둔다 */
  padding:10px 14px calc(env(safe-area-inset-bottom) + 12px + 44px);
}
.menu .item, .li, .taxrow, .card, .stmt{scroll-margin-top:72px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.card + .card{margin-top:12px;}
h2{font-size:1.06rem; margin:0 0 10px; letter-spacing:-.01em;}
h3{font-size:.95rem; margin:0 0 8px;}
p{margin:0 0 10px;} p:last-child{margin-bottom:0;}
.muted{color:var(--muted); font-size:.86rem;}
.tiny{font-size:.78rem;}
.row{display:flex; gap:10px; align-items:center;}
.spread{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:56px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-size:1.02rem; font-weight:700; font-family:inherit; cursor:pointer; padding:12px 16px;
}
.btn:active{transform:scale(.99);}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.btn.ghost{background:transparent;}
.btn.sm{min-height:44px; font-size:.9rem; border-radius:12px; width:auto; padding:8px 14px; font-weight:600;}
.btn.danger{color:var(--ng); border-color:var(--ng);}
.btn[disabled]{opacity:.45; pointer-events:none;}
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:.76rem; font-weight:700;
  padding:4px 9px; border-radius:999px; background:var(--surface2); color:var(--muted); white-space:nowrap;
}
.chip.tax{background:var(--primary); color:var(--primary-ink);}
.chip.subj{background:transparent; color:var(--text); border:1px solid var(--line);}
.chip.rev{background:var(--warn-bg); color:var(--warn);}
.chip.ok{background:var(--ok-bg); color:var(--ok);}
.chip.ng{background:var(--ng-bg); color:var(--ng);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; min-width:0;}
.stat b{display:block; font-size:1.16rem; letter-spacing:-.02em; overflow:hidden; text-overflow:ellipsis;}
.stat span{font-size:.72rem; color:var(--muted);}
.menu{display:flex; flex-direction:column; gap:10px;}
.menu .item{
  display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:16px;
  background:var(--surface); border:1px solid var(--line); cursor:pointer; text-align:left; width:100%;
  font-family:inherit; color:var(--text);
}
.menu .item:active{background:var(--surface2);}
.menu .item .ico{font-size:1.35rem; line-height:1;}
.menu .item .t{font-weight:800; font-size:1rem;}
.menu .item .d{font-size:.8rem; color:var(--muted); font-weight:500;}
.menu .item .arrow{margin-left:auto; color:var(--muted);}

/* ── 과목 선택 탭 ── */
.subjtabs{
  display:flex; flex-wrap:wrap; gap:6px; padding:2px 2px 8px; margin:0 -2px 8px;
}
.subjtabs button{
  flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:inherit; font-weight:800; font-size:.82rem; padding:8px 12px; border-radius:999px;
  cursor:pointer; white-space:nowrap;
}
.subjtabs button.on{background:var(--primary); color:var(--primary-ink); border-color:transparent;}
.subjtabs button .n{font-weight:700; font-size:.72rem; opacity:.75; margin-left:3px;}
.secttl{font-size:.78rem; font-weight:800; color:var(--muted); margin:12px 2px 8px; letter-spacing:.02em;}

/* ── 퀴즈 ── */
.qhead{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.bar{height:6px; border-radius:999px; background:var(--surface2); overflow:hidden; margin:2px 0 8px;}
.bar > i{display:block; height:100%; background:var(--primary); border-radius:999px; transition:width .25s;}
.qcount{display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); margin-bottom:10px;}
.stmt{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px;
  font-size:1.19rem; line-height:1.72; font-weight:600; letter-spacing:-.01em; box-shadow:var(--shadow);
  word-break:keep-all;
}
.stmt .qmark{color:var(--primary); font-weight:900; margin-right:2px;}
details.origin{margin-top:10px; border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden;}
details.origin > summary{
  list-style:none; padding:11px 14px; font-size:.85rem; font-weight:700; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
details.origin > summary::-webkit-details-marker{display:none;}
details.origin .body{padding:0 14px 14px; font-size:.92rem; line-height:1.7; color:var(--text); word-break:keep-all;}
.verdict{
  margin-top:14px; border-radius:16px; padding:14px 16px; font-weight:800; display:flex; align-items:center; gap:10px;
  font-size:1rem; border:1px solid transparent;
}
.verdict.good{background:var(--ok-bg); color:var(--ok); border-color:var(--ok);}
.verdict.bad{background:var(--ng-bg); color:var(--ng); border-color:var(--ng);}
.verdict .big{font-size:1.5rem; line-height:1;}
.exp{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px;}
.exp .sec + .sec{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.exp .lbl{font-size:.74rem; font-weight:800; color:var(--muted); letter-spacing:.04em; margin-bottom:4px;}
.exp .txt{font-size:.95rem; line-height:1.72; word-break:keep-all;}
.exp .arts{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
.exp .sec.trap{background:var(--warn-bg, #fff8e6); border-radius:10px; padding:8px 10px; margin-top:10px; border-top:0;}
.exp .sec.trap .lbl{color:var(--warn, #b8860b);}
.exp .sec .txt br{line-height:1.9;}
.revcard{margin-top:12px; border:1px solid var(--warn); background:var(--warn-bg); border-radius:16px; padding:14px 16px; color:var(--text);}
.revcard .ttl{font-weight:800; color:var(--warn); font-size:.92rem; margin-bottom:8px;}
.revcard .k{font-size:.74rem; font-weight:800; color:var(--warn); margin:8px 0 2px;}
.revcard .v{font-size:.9rem; line-height:1.68; word-break:keep-all;}
footer#bar .picks{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pick{
  min-height:88px; border-radius:20px; border:2px solid var(--line); background:var(--surface);
  font-family:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--text);
}
.pick .glyph{font-size:2.1rem; font-weight:900; line-height:1;}
.pick .sub{font-size:.74rem; color:var(--muted); font-weight:700;}
.pick.o{border-color:var(--ok);} .pick.o .glyph{color:var(--ok);}
.pick.x{border-color:var(--ng);} .pick.x .glyph{color:var(--ng);}
.pick:active{transform:scale(.97);}
.pick.chosen{outline:3px solid var(--primary); outline-offset:2px;}
.pick.dim{opacity:.4;}

/* ── 목록 ── */
.list{display:flex; flex-direction:column; gap:10px;}
.li{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
.li .q{font-size:.95rem; line-height:1.6; word-break:keep-all;}
.li .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px;}
.li .acts{display:flex; gap:8px; margin-top:10px;}
.li .acts .btn{flex:1 1 0; min-width:0; width:auto; min-height:42px; font-size:.82rem; border-radius:10px; padding:8px 4px; white-space:nowrap;}
.tabs{display:flex; gap:6px; margin:4px 0 12px; background:var(--surface2); padding:4px; border-radius:12px;}
.tabs button{
  flex:1; border:0; background:transparent; color:var(--muted); font-family:inherit; font-weight:800; font-size:.88rem;
  padding:9px 6px; border-radius:9px; cursor:pointer;
}
.tabs button.on{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.taxrow{display:flex; align-items:center; gap:10px; padding:13px 14px; background:var(--surface); border:1px solid var(--line); border-radius:14px;}
.taxrow > div{min-width:0;}
.taxrow .nm{font-weight:800; font-size:.95rem; word-break:keep-all;}
.taxrow .sub{font-size:.76rem; color:var(--muted);}
.taxrow .go{margin-left:auto; flex:none;}
.pbar{height:8px; border-radius:999px; background:var(--surface2); overflow:hidden; margin-top:6px;}
.pbar > i{display:block; height:100%; background:var(--ok); border-radius:999px;}
.days7{display:flex; gap:6px; align-items:flex-end; height:74px;}
.days7 .d{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0;}
.days7 .d .b{width:100%; background:var(--primary); border-radius:6px 6px 3px 3px; min-height:3px; opacity:.85;}
.days7 .d .lb{font-size:.64rem; color:var(--muted);}
.days7 .d .vl{font-size:.62rem; color:var(--muted); height:10px;}
#toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 100px); transform:translate(-50%,20px);
  background:#111a2e; color:#fff; padding:11px 16px; border-radius:12px; font-size:.86rem; font-weight:600;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:60; max-width:88vw; text-align:center;
}
#toast.on{opacity:1; transform:translate(-50%,0);}
#toast button{margin-left:10px; background:none; border:0; color:#7dd3fc; font-family:inherit; font-weight:800; font-size:.86rem; cursor:pointer;}
.nowrap{white-space:nowrap;}
.center{text-align:center;}
.sep{height:1px; background:var(--line); margin:14px 0;}
.banner{
  display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px;
  background:var(--surface2); color:var(--muted); font-size:.82rem; line-height:1.55;
}
.banner .x{margin-left:auto; background:none; border:0; color:var(--muted); font-size:1rem; cursor:pointer; padding:0 2px;}

/* ═══════════ 2026 브랜드 리뉴얼 ═══════════ */
:root{
  --primary:#4f46e5; --primary-ink:#ffffff; --accent:#f59e0b;
  --hl:rgba(245,158,11,.42); --hl-chip:rgba(245,158,11,.17); --ring:rgba(79,70,229,.16);
  --shadow:0 4px 18px rgba(24,26,60,.08);
}
html[data-theme="dark"]{
  --primary:#8b8cf7; --primary-ink:#0b1020; --accent:#fbbf24;
  --hl:rgba(251,191,36,.26); --hl-chip:rgba(251,191,36,.21); --ring:rgba(139,140,247,.22);
}
body{font-feature-settings:"tnum" 1; letter-spacing:-.005em;}
h2{font-size:1.12rem; letter-spacing:-.03em;}
#brand{align-items:center;}
#brand .mk{width:24px;height:24px;flex:none;border-radius:7px;box-shadow:0 2px 6px rgba(79,70,229,.35);}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#6d28d9); box-shadow:0 6px 16px rgba(79,70,229,.28); border-color:transparent;}
html[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#0b1020;}
.bar > i{background:linear-gradient(90deg,var(--primary),#8b5cf6);}

/* 히어로(오늘의 학습) */
.hero{
  position:relative; overflow:hidden; border-radius:22px; padding:18px 18px 16px; color:#fff;
  background:radial-gradient(120% 100% at 0% 0%, #6366f1 0%, #4f46e5 38%, #3730a3 72%, #241c6b 100%);
  box-shadow:0 14px 30px rgba(49,46,129,.32);
}
.hero::after{
  content:''; position:absolute; right:-56px; top:-70px; width:210px; height:210px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.26), rgba(255,255,255,0) 68%); pointer-events:none;
}
.hero .dday{font-size:.76rem; font-weight:800; letter-spacing:.02em; opacity:.92; display:flex; align-items:center; gap:6px;}
.hero .dday b{font-size:1rem; letter-spacing:-.02em;}
.hero h2{margin:4px 0 0; font-size:1.22rem; letter-spacing:-.035em; color:#fff;}
.hero .muted, .hero .tiny{color:rgba(255,255,255,.78);}
.hero .bar{background:rgba(255,255,255,.22); height:8px;}
.hero .bar > i{background:linear-gradient(90deg,#fff,#c7d2fe);}
.hero .tabs{background:rgba(255,255,255,.16);}
.hero .tabs button{color:rgba(255,255,255,.78);}
.hero .tabs button.on{background:rgba(255,255,255,.95); color:#312e81; box-shadow:none;}
.hero .streak{text-align:center; min-width:64px;}
.hero .streak b{display:block; font-size:1.5rem; letter-spacing:-.04em; line-height:1.1; white-space:nowrap;}
.hero .dday b{white-space:nowrap;}
@media (max-width: 380px){
  .hero{padding:16px 14px 14px;}
  .hero h2{font-size:1.04rem;}
  .hero .dday{font-size:.72rem;}
  .hero .dday .tiny{display:none;}
  .hero .streak{min-width:52px;}
  .hero .streak b{font-size:1.22rem;}
  .hero .tabs button{font-size:.82rem; padding:8px 2px;}
  .qbtn{padding:12px; min-height:80px;}
  .qbtn .t{font-size:.9rem;}
  .qbtn .d{font-size:.7rem;}
  .stmt{font-size:1.12rem;}
}

/* 퀵 액션 그리드 */
.quick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.qbtn{
  display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:left; min-height:84px;
  padding:14px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--text);
  font-family:inherit; cursor:pointer; box-shadow:var(--shadow);
}
.qbtn:active{transform:scale(.985);}
.qbtn .ic{font-size:1.2rem; line-height:1;}
.qbtn .t{font-weight:800; font-size:.94rem; letter-spacing:-.02em;}
.qbtn .d{font-size:.73rem; color:var(--muted); font-weight:600;}

/* 해설 하이라이트 — 조문·금액·용어를 단일 칩으로.
   굵기 800 + 반투명 그라데이션은 안드로이드 system-ui 폰트에서 § 글자가 뭉개지고
   줄마다 형광 띠 높이가 어긋나므로, 굵기 600 + 단색 배경 칩으로 고정한다. */
.hl{
  font-weight:600; color:inherit; background:var(--hl-chip);
  border-radius:5px; padding:1px 5px;
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
}

/* 스플래시 */
#splash{
  position:fixed; inset:0; z-index:95; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  background:radial-gradient(120% 90% at 18% 8%, #6366f1 0%, #4f46e5 30%, #312e81 68%, #1b1440 100%);
  color:#fff; transition:opacity .55s ease, visibility .55s ease;
}
#splash.off{opacity:0; visibility:hidden; pointer-events:none;}
#splash .logo{width:92px; height:92px; border-radius:26px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,.4); animation:pop .75s cubic-bezier(.2,.9,.2,1) both;}
#splash .logo svg{display:block; width:100%; height:100%;}
#splash .t{font-weight:900; letter-spacing:-.04em; font-size:1.3rem; margin-top:6px;}
#splash .s{font-size:.8rem; opacity:.82; letter-spacing:.01em;}
#splash .ln{width:136px; height:4px; border-radius:99px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:8px;}
#splash .ln i{display:block; height:100%; width:42%; border-radius:99px; background:linear-gradient(90deg,#fff,#e0e7ff); animation:load 1.05s ease-in-out infinite;}
@keyframes load{0%{transform:translateX(-115%)}100%{transform:translateX(330%)}}
@keyframes pop{from{transform:scale(.84); opacity:0} to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){#splash .logo, #splash .ln i{animation:none}}

/* 검색 */
.searchbox{display:flex; gap:8px; margin:4px 0 12px;}
.searchbox input{
  flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; background:var(--surface);
  color:var(--text); font-family:inherit; font-size:1rem; padding:12px 14px;
}
.searchbox input:focus{outline:2px solid var(--ring); border-color:var(--primary);}
.hitmark{background:var(--hl-chip); border-radius:4px; padding:1px 4px; font-weight:600;}

/* 답안지(회차 시험) */
.xrow{display:flex; flex-direction:column; gap:8px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--surface);}
.xrow .xq{display:flex; gap:8px; align-items:flex-start;}
.xrow .no{font-weight:900; color:var(--muted); font-size:.78rem; min-width:18px; padding-top:3px; flex:none;}
.xrow .q{font-size:.92rem; line-height:1.6; word-break:keep-all; flex:1; min-width:0;}
.xtgl{display:flex; gap:6px; flex:none; align-self:flex-end;}
.xtgl button{width:44px; height:36px;}
.xtgl button{
  width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2);
  color:var(--muted); font-family:inherit; font-weight:900; font-size:.95rem; cursor:pointer;
}
.xtgl button.on.o{border-color:var(--ok); color:var(--ok); background:var(--ok-bg);}
.xtgl button.on.x{border-color:var(--ng); color:var(--ng); background:var(--ng-bg);}
.xrow.right{border-color:color-mix(in srgb, var(--ok) 55%, var(--line));}
.xrow.wrong{border-color:color-mix(in srgb, var(--ng) 55%, var(--line));}

/* 메모 · 별표 */
.chip.star{cursor:pointer; font-family:inherit; border:1px solid var(--line); background:var(--surface);}

<script>
/* 오류 수집기 — E2E에서 콘솔 오류 0건 검증용 */
window.__errs = [];
window.addEventListener('error', function(e){ window.__errs.push(String(e.message || e.error)); });
window.addEventListener('unhandledrejection', function(e){ window.__errs.push('unhandledrejection: ' + String(e.reason)); });

<script src="./bank.js"></script>
<script>
(function(){
'use strict';

/* ─────────── 기본 데이터 ─────────── */
var BANK = window.BANK || [];
var byId = new Map();
BANK.forEach(function(q){ byId.set(q.id, q); });

var SUBJECTS = [];
var SHORT = {'세법학개론':'세법', '재정학':'재정학', '행정소송법':'행소법', '회계학개론(말문제)':'회계'};
var SUBJ_COUNT = {}, TOPICS = {}, TOPIC_COUNT = {};
BANK.forEach(function(q){
  SUBJ_COUNT[q.subject] = (SUBJ_COUNT[q.subject] || 0) + 1;
  if(!TOPICS[q.subject]) TOPICS[q.subject] = [];
  if(TOPICS[q.subject].indexOf(q.topic) < 0) TOPICS[q.subject].push(q.topic);
  var k = q.subject + '|' + q.topic;
  TOPIC_COUNT[k] = (TOPIC_COUNT[k] || 0) + 1;
  if(SUBJECTS.indexOf(q.subject) < 0) SUBJECTS.push(q.subject);
});
SUBJECTS.forEach(function(s){
  TOPICS[s].sort(function(a, b){ return (TOPIC_COUNT[s+'|'+b] || 0) - (TOPIC_COUNT[s+'|'+a] || 0); });
});
function shortName(s){ return SHORT[s] || s; }
function topicKey(q){ return q.subject + '|' + q.topic; }

/* ─────────── 기출 회차 인덱스 (연도·회차) ─────────── */
var ROUND_INDEX = {}, ROUNDS_BY_SUBJ = {};
BANK.forEach(function(q){
  var rk = q.subject + '|' + q.year + '|' + q.round;
  var e = ROUND_INDEX[rk];
  if(!e){ e = ROUND_INDEX[rk] = {key:rk, subject:q.subject, year:q.year, round:q.round, n:0, q:0, nums:{}}; }
  e.n++;
  if(!e.nums[q.num]){ e.nums[q.num] = 1; e.q++; }
});
Object.keys(ROUND_INDEX).forEach(function(k){
  var e = ROUND_INDEX[k];
  if(!ROUNDS_BY_SUBJ[e.subject]) ROUNDS_BY_SUBJ[e.subject] = [];
  ROUNDS_BY_SUBJ[e.subject].push(e);
});
function roundNo(r){ return parseInt(String(r || '').replace(/[^0-9]/g, ''), 10) || 0; }
SUBJECTS.forEach(function(s){
  (ROUNDS_BY_SUBJ[s] || []).sort(function(a, b){
    return (b.year - a.year) || (roundNo(b.round) - roundNo(a.round));
  });
});
function roundLabel(e){ return e.year + ' ' + e.round; }
function roundPool(e){
  return BANK.filter(function(q){ return q.subject === e.subject && q.year === e.year && q.round === e.round; });
}
function roundStat(e){
  var pool = roundPool(e), n = 0, ok = 0, seen = 0;
  pool.forEach(function(q){
    var a = S.ans[q.id];
    if(a){ n += a.n || 0; ok += a.o || 0; seen++; }
  });
  return {total:e.n, q:e.q, n:n, ok:ok, seen:seen, rate:pct(ok, n), cover:pct(seen, e.n)};
}
function roundEntries(sc){ return (sc && sc !== '전체') ? (ROUNDS_BY_SUBJ[sc] || []) : SUBJECTS.reduce(function(acc, s){
  return acc.concat(ROUNDS_BY_SUBJ[s] || []);
}, []); }

var KEY = 'sebeop_ox_v1';

/* ─────────── 상태 ─────────── */
function blank(){
  return {v:1, ans:{}, wrong:{}, days:{}, daily:{}, streak:{cur:0,best:0,last:null},
          cfg:{daily:20, count:20, scope:'전체', roundN:0}, flags:{installDismissed:false, theme:'system'},
          book:{}, memo:{}, dnk:{}};
}
var S = load();

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    var o = JSON.parse(raw);
    if(!o || typeof o !== 'object') return blank();
    var b = blank();
    b.ans = o.ans || {}; b.wrong = o.wrong || {}; b.days = o.days || {}; b.daily = o.daily || {};
    b.streak = o.streak || b.streak; b.cfg = Object.assign(b.cfg, o.cfg || {});
    b.flags = Object.assign(b.flags, o.flags || {});
    b.book = (o.book && typeof o.book === 'object') ? o.book : {};
    b.memo = (o.memo && typeof o.memo === 'object') ? o.memo : {};
    b.dnk = (o.dnk && typeof o.dnk === 'object') ? o.dnk : {};
    if(b.cfg.scope !== '전체' && SUBJECTS.indexOf(b.cfg.scope) < 0) b.cfg.scope = '전체';
    return b;
  }catch(e){ window.__errs.push('load: ' + e.message); return blank(); }
}
var saveT = 0;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ window.__errs.push('save: ' + e.message); }
}

/* ─────────── 과목 범위 ─────────── */
function scope(){ return S.cfg.scope || '전체'; }
function isAll(){ return scope() === '전체'; }
function inScope(q){ return isAll() || q.subject === scope(); }
function planKey(ds){ return isAll() ? ds : ds + '|' + scope(); }
function scopeLabel(){ return isAll() ? '전과목' : shortName(scope()); }
function scopedSize(){ return isAll() ? BANK.length : (SUBJ_COUNT[scope()] || 0); }

/* ─────────── 유틸 ─────────── */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function dkey(d){
  d = d || new Date();
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd);
}
function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return dkey(d); }
function hhmm(ts){
  var d = new Date(ts), m = d.getMonth() + 1, dd = d.getDate();
  return (m < 10 ? '0' + m : m) + '.' + (dd < 10 ? '0' + dd : dd);
}
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

/* ─────────── 강조 · D-day · 검색 유틸 ─────────── */
var EXAM_AT = {y:2027, m:4, d:24};
function ddayLeft(){
  var t = new Date(EXAM_AT.y, EXAM_AT.m - 1, EXAM_AT.d);
  var now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((t - now) / 86400000);
}
function ddayText(){
  var n = ddayLeft();
  return n > 0 ? 'D-' + n : (n === 0 ? 'D-DAY' : 'D+' + (-n));
}
/* ── 해설 하이라이트: 조문·금액·「용어」를 한 번의 패스로 감싼다 ──
   단일 replace 1회 = 이미 넣은 <b> 태그를 다시 읽지 않으므로 중첩·깨진 태그가 생기지 않는다.
   조문은 '§81의4·§81의9', '제81조의4, 제81조의5'처럼 이어 붙은 것을 한 칩으로 묶는다. */
var ART_ONE = '(?:§\\s?\\d+(?:\\s?의\\s?\\d+)?|제\\s?\\d+\\s?조(?:\\s?의\\s?\\d+)?)';
var ART_SEP = '(?:\\s*[·ㆍ・‧∙,，/]\\s*|\\s*및\\s*)';
var HL_RE = new RegExp(
  '(' + ART_ONE + '(?:' + ART_SEP + ART_ONE + ')*'
  + '|\\d[\\d,.]*\\s?(?:억|만|천)?\\s?(?:원|%|％)'
  + '|「[^」]{1,24}」'
  + ')', 'g');
function hl(s){ return esc(s).replace(HL_RE, function(m){ return '<b class="hl">' + m + '</b>'; }); }
function nl2br(s){ return String(s).split('\n').map(function(l,i){ return i ? '<br>' + l : l; }).join(''); }
var SEARCH_IDX = null;
function searchIndex(){
  if(!SEARCH_IDX){
    SEARCH_IDX = BANK.map(function(q){
      return (q.stmt + ' ' + (q.why || '') + ' ' + (q.main || '') + ' ' + (q.trap || '') + ' ' + (q.src || '') + ' ' + (q.topic || '')).toLowerCase();
    });
  }
  return SEARCH_IDX;
}
function bookmarkCount(){ return Object.keys(S.book).length; }
function examPrompt(q){
  return '세무사 1차 ' + q.subject + ' 기출 · ' + (q.src || '') + '\n\n'
    + '지문: ' + q.stmt + '\n\n'
    + '이 지문은 ' + q.answer + '입니다. (기출 해설 요지: ' + String(q.why || q.main || '').slice(0, 180) + ')\n\n'
    + '1) 왜 ' + q.answer + '인지 근거 조문과 조건을 설명해 주세요.\n'
    + '2) 이 지문에서 함정으로 바꾸기 쉬운 부분을 예시와 함께 짚어 주세요.';
}
function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg); }catch(e){ toast('복사에 실패했습니다'); }
    ta.remove();
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  }else fallback();
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  var h = 2166136261;
  for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffle(arr, rnd){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function toast(msg, actionLabel, action){
  var el = document.getElementById('toast');
  el.innerHTML = esc(msg) + (actionLabel ? '<button type="button">' + esc(actionLabel) + '</button>' : '');
  if(actionLabel){
    el.querySelector('button').addEventListener('click', function(){ el.classList.remove('on'); action && action(); });
  }
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('on'); }, actionLabel ? 5200 : 2400);
}

/* ─────────── 통계 파생 ─────────── */
function totals(){
  var n = 0, ok = 0;
  for(var k in S.days){ n += S.days[k].n || 0; ok += S.days[k].ok || 0; }
  return {n:n, ok:ok, rate:pct(ok, n)};
}
function scopeTotals(){
  var n = 0, ok = 0;
  for(var id in S.ans){
    var q = byId.get(id); if(!q || !inScope(q)) continue;
    var a = S.ans[id]; n += a.n || 0; ok += a.o || 0;
  }
  return {n:n, ok:ok, rate:pct(ok, n)};
}
function subjectStats(){
  var o = {};
  SUBJECTS.forEach(function(s){ o[s] = {n:0, ok:0, seen:0, total:SUBJ_COUNT[s] || 0}; });
  for(var id in S.ans){
    var q = byId.get(id); if(!q) continue;
    var st = o[q.subject]; if(!st) continue;
    var a = S.ans[id]; st.n += a.n || 0; st.ok += a.o || 0; st.seen += 1;
  }
  SUBJECTS.forEach(function(s){ var x = o[s]; x.rate = pct(x.ok, x.n); x.cover = pct(x.seen, x.total); });
  return o;
}
function topicStats(subject){
  var o = {};
  (TOPICS[subject] || []).forEach(function(t){
    o[t] = {n:0, ok:0, seen:0, total:TOPIC_COUNT[subject + '|' + t] || 0, subject:subject};
  });
  for(var id in S.ans){
    var q = byId.get(id); if(!q || q.subject !== subject) continue;
    var st = o[q.topic]; if(!st) continue;
    var a = S.ans[id]; st.n += a.n || 0; st.ok += a.o || 0; st.seen += 1;
  }
  for(var t2 in o){ o[t2].rate = pct(o[t2].ok, o[t2].n); o[t2].cover = pct(o[t2].seen, o[t2].total); }
  return o;
}
function wrongList(onlyOpen){
  var out = [];
  for(var id in S.wrong){
    var q = byId.get(id); if(!q || !inScope(q)) continue;
    var w = S.wrong[id];
    if(onlyOpen && w.res) continue;
    out.push({id:id, q:q, w:w});
  }
  out.sort(function(a, b){
    if(!!a.w.res !== !!b.w.res) return a.w.res ? 1 : -1;
    return (b.w.w - a.w.w) || (b.w.last - a.w.last);
  });
  return out;
}
function rounds(){
  var t = scopeTotals(), size = scopedSize() || 1;
  var seen = 0;
  for(var id in S.ans){ var q = byId.get(id); if(q && inScope(q)) seen++; }
  return {n: t.n / size, cover: seen, size: size, label: fmtRounds(t.n / size)};
}
function fmtRounds(v){
  if(v < 1) return v.toFixed(2);
  if(v < 10) return v.toFixed(1);
  return Math.round(v).toString();
}

/* ─────────── 세션 만들기 ─────────── */
function priorityOrder(list, rnd){
  var arr = shuffle(list, rnd);
  arr.sort(function(a, b){
    var A = S.ans[a.id], B = S.ans[b.id];
    var ua = A ? 0 : 1, ub = B ? 0 : 1;              // 미학습 우선
    if(ua !== ub) return ub - ua;
    return ((A && A.last) || 0) - ((B && B.last) || 0); // 오래된 것 우선
  });
  return arr;
}
function buildDaily(dateStr, n){
  var sc = scope();
  var rnd = mulberry32(hashStr('daily:' + dateStr + ':' + sc));
  var base = BANK.filter(function(q){ return inScope(q); });
  var open = wrongList(true);
  var picked = [], used = {}, usedQ = {};
  function qkey(q){ return q.subject + '|' + q.year + '|' + q.num; }
  function canTake(q){ return !used[q.id] && !usedQ[qkey(q)]; }
  function take(q){ picked.push(q.id); used[q.id] = 1; usedQ[qkey(q)] = 1; }
  var wantWrong = Math.min(open.length, Math.max(0, Math.round(n * 0.3)), Math.max(0, n - 1));
  for(var i = 0; i < open.length && picked.length < wantWrong; i++){
    if(canTake(open[i].q)) take(open[i].q);
  }
  var rest = n - picked.length;
  var pool = priorityOrder(base.filter(function(q){ return !used[q.id]; }), rnd);
  var keys = [];
  base.forEach(function(q){ var k = topicKey(q); if(keys.indexOf(k) < 0) keys.push(k); });
  var quota = {}, left = rest;
  keys.forEach(function(k){
    quota[k] = Math.min(Math.round(rest * (TOPIC_COUNT[k] || 0) / (base.length || 1)), left);
    left -= quota[k];
  });
  keys.forEach(function(k){
    var take2 = 0;
    for(var j = 0; j < pool.length && take2 < quota[k]; j++){
      if(topicKey(pool[j]) === k && canTake(pool[j])){ take(pool[j]); pool.splice(j, 1); j--; take2++; }
    }
  });
  // 같은 문항의 다른 선지는 한 세트에 넣지 않는다(중복 회피) — 빈자리는 같은 문항 허용
  for(var k2 = 0; k2 < pool.length && picked.length < n; k2++){
    if(!used[pool[k2].id] && !usedQ[qkey(pool[k2])]){ take(pool[k2]); }
  }
  for(var k3 = 0; k3 < pool.length && picked.length < n; k3++){
    if(!used[pool[k3].id]){ take(pool[k3]); }
  }
  return shuffle(picked, rnd);
}
function startSession(mode, opts){
  opts = opts || {};
  var ids = [], dateStr = dkey();
  if(mode === 'daily'){
    var pk = planKey(dateStr);
    var plan = S.daily[pk];
    if(!plan || !plan.ids || !plan.ids.filter(function(id){ return byId.has(id); }).length){
      plan = {ids: buildDaily(dateStr, S.cfg.daily), done:{}, ok:0, at:Date.now(), scope:scope()};
      S.daily[pk] = plan; pruneDaily(); save();
    }
    ids = plan.ids.filter(function(id){ return byId.has(id); });
    dateStr = pk;
  }else if(mode === 'focus'){
    var n = opts.n || S.cfg.count;
    var rnd = mulberry32(hashStr('focus:' + opts.subject + ':' + opts.topic + ':' + dateStr + ':' + Object.keys(S.ans).length));
    var pool = BANK.filter(function(q){ return q.subject === opts.subject && q.topic === opts.topic; });
    ids = priorityOrder(pool, rnd).slice(0, n).map(function(q){ return q.id; });
  }else if(mode === 'wrong'){
    var n2 = opts.n || 20;
    ids = wrongList(true).slice(0, n2).map(function(x){ return x.id; });
  }else if(mode === 'book'){
    var poolB = BANK.filter(function(q){ return inScope(q) && S.book[q.id]; });
    var rndB = mulberry32(hashStr('book:' + dateStr + ':' + Object.keys(S.ans).length));
    ids = priorityOrder(poolB, rndB).map(function(q){ return q.id; });
    if(opts.n) ids = ids.slice(0, opts.n);
  }else if(mode === 'round'){
    ids = buildRoundIds(opts, opts.n || 0);
  }
  var answered = {};
  var i = 0;
  if(mode === 'daily'){
    var p = S.daily[dateStr];
    ids.forEach(function(id){ if(p.done[id]) answered[id] = p.done[id]; });
    while(i < ids.length && answered[ids[i]]) i++;
  }
  session = {mode:mode, ids:ids, i:i, answered:answered, ok:0,
             subject:opts.subject || null, topic:opts.topic || null, date:dateStr,
             year:opts.year || null, round:opts.round || null,
             startedAt:Date.now(), picked:null};
  view = {name:'quiz'};
  render();
}
/* 한 회차 = 문항당 지문 1개. 아직 안 푼 지문이 남은 문항을 번호 순으로 먼저, 남는 자리는 푼 문항에서. */
function buildRoundIds(opts, n){
  var pool = BANK.filter(function(q){ return q.subject === opts.subject && q.year === opts.year && q.round === opts.round; });
  var byNum = {}, nums = [];
  pool.forEach(function(q){
    if(!byNum[q.num]){ byNum[q.num] = []; nums.push(q.num); }
    byNum[q.num].push(q);
  });
  nums.sort(function(a, b){ return a - b; });
  var rnd = mulberry32(hashStr('round:' + opts.subject + ':' + opts.year + ':' + opts.round + ':' + Object.keys(S.ans).length));
  var out = [], rest = [];
  nums.forEach(function(num){
    var arr = byNum[num];
    var unseen = arr.filter(function(q){ return !S.ans[q.id]; });
    if(unseen.length){ out.push(unseen[Math.floor(rnd() * unseen.length)].id); }
    else { rest.push(arr); }
  });
  shuffle(rest, rnd).forEach(function(arr){
    out.push(arr[Math.floor(rnd() * arr.length)].id);
  });
  if(n > 0) out = out.slice(0, n);
  return out;
}
function pruneDaily(){
  var keys = Object.keys(S.daily).sort();
  while(keys.length > 60){ delete S.daily[keys.shift()]; }
}

/* ─────────── 답하기 ─────────── */
function recordAnswer(q, pick){
  var ok = (pick === q.answer);
  var a = S.ans[q.id] || (S.ans[q.id] = {n:0, o:0, x:0, last:0, lw:0});
  a.n++; a.last = Date.now();
  if(ok){ a.o++; } else { a.x++; a.lw = Date.now(); }
  var undo = null;
  if(!ok){
    var w = S.wrong[q.id] || (S.wrong[q.id] = {w:0, last:0, res:0});
    w.w++; w.last = Date.now(); w.res = 0;
    if(pick === '?') S.dnk[q.id] = Date.now();
  }else{
    if(S.dnk[q.id]) delete S.dnk[q.id];
    if(S.wrong[q.id] && !S.wrong[q.id].res){
      S.wrong[q.id].res = 1; S.wrong[q.id].last = Date.now(); undo = q.id;
    }
  }
  var ds = dkey();
  var d = S.days[ds] || (S.days[ds] = {n:0, ok:0});
  d.n++; if(ok) d.ok++;
  touchStreak(ds);
  return {ok:ok, undo:undo};
}
function answer(pick){
  if(!session) return;
  var q = byId.get(session.ids[session.i]);
  if(!q || session.answered[q.id]) return;
  var r = recordAnswer(q, pick);
  session.answered[q.id] = pick;
  session.picked = pick;
  if(r.ok) session.ok++;
  if(session.mode === 'daily'){
    var plan = S.daily[session.date] || (S.daily[session.date] = {ids:session.ids, done:{}, ok:0});
    plan.done[q.id] = pick; if(r.ok) plan.ok = (plan.ok || 0) + 1;
  }
  save(); render();
  if(r.undo) toast('오답노트에서 해결됨으로 옮겼습니다', '되돌리기', function(){
    if(S.wrong[r.undo]){ S.wrong[r.undo].res = 0; save(); render(); }
  });
}
function touchStreak(ds){
  var st = S.streak;
  if(st.last === ds) return;
  var y = addDays(-1);
  st.cur = (st.last === y) ? (st.cur || 0) + 1 : 1;
  st.last = ds;
  st.best = Math.max(st.best || 0, st.cur);
}
function nextQ(){
  if(!session) return;
  session.i++;
  session.picked = null;
  if(session.i >= session.ids.length){ view = {name:'done'}; }
  render();
}

/* ─────────── 회차 답안지(시험 모드) ─────────── */
var exam = null, examResult = null;
function startExam(subject, year, round){
  var ids = buildRoundIds({subject:subject, year:year, round:round}, 0);
  if(!ids.length){ toast('이 회차에 지문이 없습니다'); return; }
  exam = {subject:subject, year:year, round:round, items:ids.map(function(id){ return {id:id, pick:null, ok:null}; }), at:Date.now()};
  session = null;
  view = {name:'exam'}; render();
}
function renderExam(v, b){
  var e = exam;
  if(!e){ view = {name:'home'}; render(); return; }
  var answered = e.items.filter(function(it){ return !!it.pick; }).length;
  v.innerHTML =
    '<div class="spread" style="margin:8px 2px 8px"><h2 style="margin:0">' + esc(shortName(e.subject)) + ' ' + esc(e.year + ' ' + e.round) + ' 답안지</h2>' +
      '<button class="btn sm ghost" type="button" data-act="home">홈</button></div>' +
    '<div class="banner" style="margin-bottom:10px">O/X만 빠르게 골라 두고 한 번에 채점합니다. 제출하면 틀린 지문부터 해설로 이어집니다.</div>' +
    '<div class="list">' + e.items.map(function(it, i){
      var q = byId.get(it.id);
      return '<div class="xrow"><div class="xq"><span class="no">' + (i + 1) + '</span>' +
        '<div class="q">' + esc(q.stmt) + '</div></div>' +
        '<div class="xtgl"><button type="button" data-act="xpick" data-i="' + i + '" data-v="O" class="' + (it.pick === 'O' ? 'on o' : '') + '">O</button>' +
        '<button type="button" data-act="xpick" data-i="' + i + '" data-v="X" class="' + (it.pick === 'X' ? 'on x' : '') + '">X</button></div></div>';
    }).join('') + '</div>';
  b.innerHTML = '<button class="btn primary" id="xsubmit" type="button" data-act="xsubmit" style="min-height:64px">' +
    '채점하기 · ' + answered + ' / ' + e.items.length + ' 답함</button>';
}
function paintExamRow(i){
  if(!exam) return;
  var rows = document.querySelectorAll('#view .xrow');
  var row = rows[i];
  if(!row) return;
  var btns = row.querySelectorAll('.xtgl button');
  var it = exam.items[i];
  if(!btns[1]) return;
  btns[0].className = (it.pick === 'O' ? 'on o' : '');
  btns[1].className = (it.pick === 'X' ? 'on x' : '');
  var sb = document.getElementById('xsubmit');
  if(sb){
    var ansd = exam.items.filter(function(x){ return !!x.pick; }).length;
    sb.textContent = '채점하기 · ' + ansd + ' / ' + exam.items.length + ' 답함';
  }
}
function submitExam(){
  if(!exam) return;
  var ok = 0, done = 0;
  exam.items.forEach(function(it){
    if(!it.pick) return;
    var q = byId.get(it.id);
    var r = recordAnswer(q, it.pick);
    it.ok = r.ok; done++; if(r.ok) ok++;
  });
  exam.ok = ok; exam.done = done;
  save();
  examResult = exam;
  view = {name:'examresult'}; render();
}
function renderExamResult(v, b){
  var e = examResult;
  if(!e){ view = {name:'home'}; render(); return; }
  var rate = pct(e.ok, e.done);
  var wrongIds = e.items.filter(function(it){ return it.ok === false; });
  v.innerHTML =
    '<div class="card center" style="margin-top:12px">' +
      '<div class="muted tiny">' + esc(shortName(e.subject)) + ' ' + esc(e.year + ' ' + e.round) + ' 채점 결과</div>' +
      '<div class="score" style="--p:' + rate + '"><i>' + rate + '%</i></div>' +
      '<div class="muted">' + e.done + '문항 중 ' + e.ok + '문항 정답 · 오답 ' + (e.done - e.ok) + (e.items.length - e.done ? ' · 미응답 ' + (e.items.length - e.done) : '') + '</div>' +
    '</div>' +
    '<div class="list" style="margin-top:12px">' + e.items.map(function(it, i){
      var q = byId.get(it.id);
      var cls = it.ok === true ? 'right' : (it.ok === false ? 'wrong' : '');
      var mark = it.ok === true ? '✓' : (it.ok === false ? '✕' : '–');
      return '<div class="li ' + cls + '"><div class="q">' + '<b style="color:' + (it.ok === true ? 'var(--ok)' : it.ok === false ? 'var(--ng)' : 'var(--muted)') + '">' + mark + '</b> ' + (i + 1) + '. ' + esc(q.stmt.slice(0, 150)) + (q.stmt.length > 150 ? '…' : '') + '</div>' +
        '<div class="meta"><span class="chip">정답 ' + q.answer + (it.pick ? ' · 내 답 ' + it.pick : ' · 미응답') + '</span>' +
        '<span class="chip">' + esc(q.topic) + '</span></div>' +
        '<div class="acts"><button class="btn sm" type="button" data-act="review-one" data-id="' + esc(q.id) + '">해설 보기</button></div></div>';
    }).join('') + '</div>';
  b.innerHTML = '<div class="row">' +
    '<button class="btn" type="button" data-act="home">홈</button>' +
    '<button class="btn primary" type="button" data-act="wrong" style="flex:1.6">오답 집중으로 이어서</button></div>';
}

function renderQuiz(v, b){
  var s = session;
  if(!s.ids.length){
    v.innerHTML = '<div class="card center"><h2>출제할 문항이 없습니다</h2><p class="muted">다른 과목이나 단원을 선택해 주세요.</p></div>';

    return;
  }
  var q = byId.get(s.ids[s.i]);
  var picked = s.answered[q.id] || null;

  var correct = (picked === q.answer);
  var pos = s.i + 1;
  var expHTML = '';

  if(isAnswered){
    var secs = [];

    if(q.main) secs.push('<div class="sec"><div class="lbl">근거·이론' + (q.ans ? ' · 공식 정답 ' + esc(q.ans) : '') + '</div><div class="txt">' + nl2br(hl(q.main)) + '</div></div>');
    if(q.trap) secs.push('<div class="sec trap"><div class="lbl">⛳ 함정 포인트</div><div class="txt">' + nl2br(hl(q.trap)) + '</div></div>');

      arts.map(function(a){ return '<span class="chip">' + esc(a) + '</span>'; }).join('') + '</div></div>');
    secs.push('<div class="sec"><div class="lbl">출처</div><div class="txt">' + esc(q.src) + ' · ' + esc(q.subject) + '</div></div>');
    expHTML = '<div class="exp">' + secs.join('') + '</div>';
    if(q.revised && q.rev_note){
      var n = q.rev_note;
      var inlineNote = (n.title || '').indexOf('해설의 2026') >= 0;
      var body = '';
      if(inlineNote){
        body = '<div class="v">이 문항 해설에 <b>[2026 개정 반영]</b> 표시가 있습니다 — 위 「문항 전체 해설」의 표시 부분이 현행 기준입니다.</div>';
      }else{
        body = (n.gichul ? '<div class="k">기출에서 물은 것</div><div class="v">' + hl(n.gichul) + '</div>' : '') +
               (n.current ? '<div class="k">2026 현행</div><div class="v">' + hl(n.current) + '</div>' : '') +
               (n.point ? '<div class="k">포인트</div><div class="v">' + hl(n.point) + '</div>' : '');
      }
      expHTML += '<div class="revcard"><div class="ttl">🔄 2026 개정 반영' +
        (inlineNote ? '' : (n.title ? ' · ' + esc(n.title) : '')) + '</div>' + body +
        '<div class="v tiny" style="margin-top:8px;opacity:.85">위 O/X는 <b>출제 당시 법령</b> 기준입니다. 현행 시험에서는 현행 기준으로 판단하세요.</div></div>';
    }
  }

  v.innerHTML =
    '<div class="qhead">' +
      '<span class="chip subj">' + esc(shortName(q.subject)) + '</span>' +
      '<span class="chip tax">' + esc(q.topic) + '</span>' +
      '<span class="chip">' + esc(q.src) + '</span>' +
      (q.revised ? '<span class="chip rev">🔄 2026 개정 반영</span>' : '') +
      (S.wrong[q.id] ? '<span class="chip ng">누적 ' + S.wrong[q.id].w + '회 틀림</span>' : '') +
      '<button class="chip star ' + (S.book[q.id] ? 'on' : '') + '" type="button" data-act="bookq" data-id="' + esc(q.id) + '">' +
        (S.book[q.id] ? '★ 저장됨' : '☆ 저장') + '</button>' +
    '</div>' +
    '<div class="bar"><i style="width:' + pct(pos - 1, s.ids.length) + '%"></i></div>' +
    '<div class="qcount"><span>' + pos + ' / ' + s.ids.length + '</span><span>정답 ' + s.ok + ' · 오답 ' + (Object.keys(s.answered).length - s.ok) + '</span></div>' +
    '<div class="stmt"><span class="qmark">Q.</span>' + esc(q.stmt) + '</div>' +
    (q.q && q.q !== q.stmt ? '<details class="origin"><summary>📄 이 선지의 문제 원문 보기</summary><div class="body">' + esc(q.q) + '</div></details>' : '') +
    (isAnswered ?
      '<div class="verdict ' + (correct ? 'good' : 'bad') + '">' +
        '<span class="big">' + (correct ? '✓' : '✕') + '</span>' +
        '<span>' + (s.review ? '해설 · 정답은 <b>' + q.answer + '</b>'
          : picked === '?' ? '모르는 지문으로 표시했습니다 · 정답은 <b>' + q.answer + '</b>'
          : (correct ? '정답입니다' : '오답입니다') + ' · 이 지문은 <b>' + q.answer + '</b>' + (correct ? '' : ' (내 답 ' + picked + ')')) +
        '</span></div>' + expHTML +
      '<details class="memo"' + (S.memo[q.id] ? ' open' : '') + '><summary>📝 내 메모' + (S.memo[q.id] ? ' · 적어 둠' : '') + '</summary>' +
        '<div class="in"><textarea data-memoid="' + esc(q.id) + '" placeholder="헷갈린 포인트, 헷갈린 이유, 다음에 볼 것…">' + esc(S.memo[q.id] || '') + '</textarea></div></details>' +
      '<div class="row" style="margin-top:10px;gap:8px">' +

      '</div>'
      :
      '<div class="banner" style="margin-top:12px"><b>O</b> = 이 지문이 맞다 &nbsp;·&nbsp; <b>X</b> = 이 지문이 틀리다</div>');

  if(!isAnswered){
    b.innerHTML = '<div class="picks">' +

      '<button class="pick x" type="button" data-act="pick" data-v="X"><span class="glyph">X</span><span class="sub">틀리다</span></button>' +
      '</div>' +
      '<button class="btn ghost" type="button" data-act="pick" data-v="?" style="min-height:48px;margin-top:8px;font-size:.9rem">🤷 모르겠음 — 오답노트에 담기</button>';
  }else{

      ? '<button class="btn primary" type="button" data-act="back-exam" style="min-height:64px">시험 결과로 돌아가기</button>'
      : '<button class="btn primary" type="button" data-act="next" style="min-height:64px">' +
        (pos >= s.ids.length ? '결과 보기 →' : '다음 문항 →') + '</button>';

function sessionLabel(s){
  if(!s) return '';
  if(s.mode === 'daily') return scopeLabel() + ' 데일리';
  if(s.mode === 'focus') return shortName(s.subject || '') + ' · ' + (s.topic || '') + ' 집중';
  if(s.mode === 'round') return shortName(s.subject || '') + ' · ' + (s.year || '') + ' ' + (s.round || '') + ' 기출';
  if(s.mode === 'book') return '북마크';
  return '오답 집중';
}

function renderDone(v, b){
  var s = session || {ids:[], ok:0, answered:{}, mode:'daily'};
  var total = s.ids.length, done = Object.keys(s.answered).length;
  var rate = pct(s.ok, total);
  var open = wrongList(true);
  var msg = s.mode === 'wrong'
      ? (rate >= 80 ? '오답 지문을 거의 다 해결했습니다.' : '아직 헷갈리는 지문이 남아 있습니다. 해설을 한 번 더 읽어 보세요.')
      : s.mode === 'round'
      ? (rate >= 80 ? '이 회차는 거의 잡혔습니다. 다른 회차로 넘어가 보세요.'
        : '이 회차에서 틀린 지문은 오답노트에 쌓였습니다. 회차별 풀기로 한 번 더 돌려 보세요.')
      : (rate >= 90 ? '아주 좋습니다. 이 단원은 거의 잡혔어요.'
        : rate >= 70 ? '기본은 잡혔습니다. 틀린 지문만 다시 보면 됩니다.'
        : '오답이 많습니다. 해설의 「이 선지가 그런 이유」를 다시 읽어 보세요.');
  v.innerHTML =
    '<div class="card center" style="margin-top:16px">' +
      '<div class="muted tiny">' + esc(sessionLabel(s)) + ' 완료</div>' +
      '<div class="score" style="--p:' + rate + '"><i>' + rate + '%</i></div>' +
      '<div class="muted">' + done + '문항 중 ' + s.ok + '문항 정답 · 오답 ' + (done - s.ok) + '</div>' +
      '<p class="muted" style="margin-top:10px">' + msg + '</p>' +
      (rate >= 90 && done ? '<div class="tiny" style="margin-top:6px;font-weight:800;color:var(--primary)">🎉 좋아요, 이 회독이 쌓이고 있습니다</div>' : '') +
    '</div>' +
    '<div class="grid2" style="margin-top:12px">' +
      '<div class="stat"><b>' + scopeTotals().n + '</b><span>누적 풀이</span></div>' +
      '<div class="stat"><b>' + open.length + '</b><span>오답노트(미해결)</span></div>' +
    '</div>' +
    '<div class="card" style="margin-top:12px"><h3>이번 세션에서 틀린 지문</h3>' +
      (function(){
        var ids = Object.keys(s.answered).filter(function(id){ return s.answered[id] !== (byId.get(id) || {}).answer; });
        if(!ids.length) return '<p class="muted">없습니다. 전부 맞혔어요.</p>';
        return '<div class="list">' + ids.slice(0, 8).map(function(id){
          var q = byId.get(id);
          return '<div class="li"><div class="q">' + esc(q.stmt) + '</div><div class="meta">' +
            '<span class="chip subj">' + esc(shortName(q.subject)) + '</span><span class="chip">' + esc(q.topic) + '</span>' +
            '<span class="chip ng">정답 ' + q.answer + '</span></div></div>';
        }).join('') + '</div>' + (ids.length > 8 ? '<p class="muted tiny" style="margin-top:8px">외 ' + (ids.length - 8) + '문항은 오답노트에 있습니다.</p>' : '');
      })() +
    '</div>';
  b.innerHTML = '<div class="row">' +
    '<button class="btn" type="button" data-act="home">홈</button>' +
    '<button class="btn primary" type="button" data-act="wrong" style="flex:1.6">오답 집중으로 이어서</button></div>';
}

function renderStats(v, b){
  var st = scopeTotals(), r = rounds(), subj = subjectStats();
  var all = wrongList(false), open = all.filter(function(x){ return !x.w.res; });
  var days = [];
  for(var i = 6; i >= 0; i--){
    var k = addDays(-i), d = S.days[k] || {n:0, ok:0};
    days.push({k:k, n:d.n, ok:d.ok, lb:(new Date(k.replace(/-/g,'/')).getMonth()+1) + '/' + (new Date(k.replace(/-/g,'/')).getDate())});
  }
  var maxN = Math.max.apply(null, days.map(function(d){ return d.n; }).concat([1]));
  var rowsSubj = SUBJECTS.map(function(name){
    var x = subj[name];
    return '<div style="margin-bottom:12px"><div class="spread tiny"><span style="font-weight:800">' + esc(name) + '</span>' +
      '<span class="muted">' + (x.n ? x.rate + '% · ' + x.n + '문항 · 커버 ' + x.cover + '%' : '미학습') + '</span></div>' +
      '<div class="pbar"><i style="width:' + (x.n ? x.rate : 0) + '%;background:' + (x.n ? 'var(--primary)' : 'transparent') + '"></i></div></div>';
  }).join('');
  var rowsTopic = '';
  if(!isAll()){
    var ts = topicStats(scope());
    rowsTopic = '<div class="card" style="margin-top:12px"><h3>' + esc(scopeLabel()) + ' 단원별 정답률</h3>' +
      (TOPICS[scope()] || []).map(function(name){
        var x = ts[name];
        return '<div style="margin-bottom:12px"><div class="spread tiny"><span style="font-weight:800">' + esc(name) + '</span>' +
          '<span class="muted">' + (x.n ? x.rate + '% · ' + x.n + '문항' : '미학습') + '</span></div>' +
          '<div class="pbar"><i style="width:' + (x.n ? x.rate : 0) + '%;background:' + (x.n ? 'var(--primary)' : 'transparent') + '"></i></div></div>';
      }).join('') + '</div>';
  }

  var rEnts = roundEntries(scope());
  var rowsRound = rEnts.length ? '<div class="card" style="margin-top:12px"><h3>기출 회차별 진도</h3>' +
    rEnts.map(function(e){
      var x = roundStat(e);
      return '<div style="margin-bottom:10px"><div class="spread tiny"><span style="font-weight:800">' + esc(shortName(e.subject)) + ' · ' + esc(roundLabel(e)) + '</span>' +
        '<span class="muted">' + (x.n ? x.rate + '% · 커버 ' + x.cover + '%' : '미학습') + '</span></div>' +
        '<div class="pbar"><i style="width:' + (x.n ? x.cover : 0) + '%;background:' + (x.n ? 'var(--primary)' : 'transparent') + '"></i></div></div>';
    }).join('') + '</div>' : '';

  v.innerHTML =
    '<div class="spread" style="margin:8px 2px 8px"><h2 style="margin:0">학습 기록</h2>' +
      '<button class="btn sm ghost" type="button" data-act="home">홈</button></div>' +
    scopeChips() +
    '<div class="grid2">' +
      '<div class="stat"><b>' + (S.streak.cur || 0) + '일</b><span>현재 스트릭 (최장 ' + (S.streak.best || 0) + '일)</span></div>' +
      '<div class="stat"><b>' + st.n + '</b><span>' + esc(scopeLabel()) + ' 푼 지문 (' + st.rate + '% 정답)</span></div>' +
      '<div class="stat"><b>' + r.label + '회독</b><span>누적 ' + st.n + '지문 ÷ ' + r.size + '개</span></div>' +
      '<div class="stat"><b>' + r.cover + ' / ' + r.size + '</b><span>지문 커버리지</span></div>' +
    '</div>' +
    '<div class="card" style="margin-top:12px"><h3>최근 7일</h3><div class="days7">' +
      days.map(function(d){
        var h = Math.round((d.n / maxN) * 54) + 4;
        return '<div class="d"><div class="vl">' + (d.n || '') + '</div>' +
          '<div class="b" style="height:' + h + 'px;background:' + (d.n ? 'var(--primary)' : 'var(--surface2)') + '"></div>' +
          '<div class="lb">' + esc(d.lb) + '</div></div>';
      }).join('') + '</div></div>' +
    '<div class="card" style="margin-top:12px"><h3>과목별 정답률</h3>' + rowsSubj +
      '<div class="sep"></div><div class="spread tiny muted"><span>오답노트 다시 볼 문항</span><b>' + open.length + '개</b></div>' +
      '<div class="spread tiny muted" style="margin-top:4px"><span>해결된 문항</span><b>' + (all.length - open.length) + '개</b></div></div>' +
    rowsTopic +
    rowsRound +
    '<div class="card" style="margin-top:12px"><h3>백업 · 복원</h3>' +
      '<p class="muted tiny">기록은 이 브라우저에만 저장됩니다. 폰을 바꾸거나 브라우저를 정리하기 전에 백업해 두세요.</p>' +
      '<div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-act="export">JSON 내보내기</button>' +
      '<button class="btn sm" type="button" data-act="import">불러오기</button></div>' +
      '<p class="muted tiny" style="margin-top:8px">불러오기는 지금 기록을 백업 파일로 덮어씁니다.</p>' +
      '<input type="file" id="importfile" accept="application/json,.json" style="display:none">' +
      '<div class="sep"></div><button class="btn sm danger" type="button" data-act="reset">기록 초기화</button></div>' +
    '<div class="banner" style="margin-top:12px">수록 지문 ' + BANK.length + '개 · ' + SUBJECTS.length + '과목(' +
      SUBJECTS.map(function(s){ return esc(shortName(s)) + ' ' + SUBJ_COUNT[s]; }).join(' · ') +
      ') — 2017·2021~2026 기출 선지 중 해설·정답표로 O/X를 확정할 수 있는 지문만 담았습니다.</div>';
  b.innerHTML = '';
}

/* ─────────── 테마 ─────────── */
function applyTheme(){
  var t = S.flags.theme || 'system';
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var btn = document.getElementById('themebtn');
  if(btn) btn.textContent = dark ? '☀️' : '🌙';
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark ? '#0a0f1e' : '#f4f6fb');
}

/* ─────────── 내보내기 / 불러오기 ─────────── */
function exportJSON(){
  var payload = {app:'sebeop-ox', v:2, exportedAt:new Date().toISOString(), bank:BANK.length, scope:scope(), data:S};
  var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'sebeop-ox-backup-' + dkey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('백업 파일을 내보냈습니다');
}
function importJSON(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      var d = o && o.data ? o.data : o;
      if(!d || typeof d !== 'object' || !d.ans || !d.days) throw new Error('형식이 맞지 않습니다');
      if(!confirm('지금 기록을 백업 파일로 덮어쓸까요? (현재 기록 ' + totals().n + '문항 → ' + (Object.keys(d.ans).length ? '가져온 기록' : '빈 기록') + ')')) return;
      var b = blank();
      b.ans = d.ans || {}; b.wrong = d.wrong || {}; b.days = d.days || {}; b.daily = d.daily || {};
      b.streak = d.streak || b.streak; b.cfg = Object.assign(b.cfg, d.cfg || {});
      b.book = d.book || {}; b.memo = d.memo || {}; b.dnk = d.dnk || {};
      if(b.cfg.scope !== '전체' && SUBJECTS.indexOf(b.cfg.scope) < 0) b.cfg.scope = '전체';
      b.flags = S.flags;
      S = b; save(); view = {name:'stats'}; render();
      toast('기록을 불러왔습니다 · ' + totals().n + '문항');
    }catch(e){ toast('불러오기 실패: ' + e.message); }
  };
  rd.readAsText(file);
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  var top = ev.target.closest('#themebtn, #statsbtn, #homebtn');
  if(top){
    if(top.id === 'themebtn'){
      var order = ['system','light','dark'];
      var cur = S.flags.theme || 'system';
      S.flags.theme = order[(order.indexOf(cur) + 1) % order.length];
      save(); applyTheme();
      toast(S.flags.theme === 'system' ? '테마: 기기 설정 따름' : S.flags.theme === 'dark' ? '테마: 다크' : '테마: 라이트');
    }else if(top.id === 'statsbtn'){
      view = {name:'stats'}; render();
    }else{
      view = {name:'home'}; session = null; render();
    }
    return;
  }
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act === 'scope'){
    var s2 = el.getAttribute('data-s');
    if(s2 === scope()) return;
    S.cfg.scope = s2; save();
    if(view.name === 'quiz'){ view = {name:'home'}; session = null; }
    render();
    toast('과목: ' + (s2 === '전체' ? '전체' : s2));
  }
  else if(act === 'daily'){
    var plan = S.daily[planKey(dkey())];
    if(plan && plan.ids && Object.keys(plan.done || {}).length >= plan.ids.length && plan.ids.length){
      delete S.daily[planKey(dkey())]; save();
    }
    startSession('daily');
  }else if(act === 'topics'){ view = {name:'topics'}; render(); }
  else if(act === 'rounds'){ view = {name:'rounds'}; render(); }
  else if(act === 'set-roundn'){
    S.cfg.roundN = parseInt(el.getAttribute('data-n'), 10) || 0; save(); render();
  }else if(act === 'review-one'){
    var rid = el.getAttribute('data-id');
    if(byId.has(rid)){
      var rq = byId.get(rid), ra = {};
      ra[rid] = rq.answer;
      session = {mode:'wrong', ids:[rid], i:0, answered:ra, ok:0, subject:null, topic:null,
                 date:dkey(), picked:null, review:true};
      view = {name:'quiz'}; render();
    }
  }else if(act === 'back-exam'){ session = null; view = {name:'examresult'}; render(); }
  else if(act === 'book'){ view = {name:'book'}; render(); }
  else if(act === 'search'){ view = {name:'search', q:''}; render(); }
  else if(act === 'bookq'){ toggleBook(el.getAttribute('data-id')); }
  else if(act === 'ai'){
    var aq = byId.get(el.getAttribute('data-id'));
    if(aq) copyText(examPrompt(aq), '질문을 복사했습니다 — ChatGPT·Gemini에 붙여넣으세요');
  }else if(act === 'start-book'){
    if(!bookmarkCount()){ toast('북마크가 비어 있습니다'); return; }
    startSession('book', {n: Math.min(bookmarkCount(), 20)});
  }else if(act === 'start-exam'){
    startExam(el.getAttribute('data-subject'), parseInt(el.getAttribute('data-year'), 10), el.getAttribute('data-round'));
  }else if(act === 'xpick'){
    var xi = parseInt(el.getAttribute('data-i'), 10), xv = el.getAttribute('data-v');
    if(exam && exam.items[xi]){ exam.items[xi].pick = (exam.items[xi].pick === xv ? null : xv); paintExamRow(xi); }
  }else if(act === 'xsubmit'){
    if(!exam) return;
    var rest = exam.items.filter(function(it){ return !it.pick; }).length;
    if(rest && !confirm('미응답 ' + rest + '문항은 채점에서 빠집니다. 제출할까요?')) return;
    submitExam();
  }else if(act === 'start-round'){
    startSession('round', {subject: el.getAttribute('data-subject'),
      year: parseInt(el.getAttribute('data-year'), 10),
      round: el.getAttribute('data-round'), n: S.cfg.roundN || 0});
  }
  else if(act === 'wrong'){ view = {name:'wrong', tab:'open'}; render(); }
  else if(act === 'home'){ view = {name:'home'}; session = null; render(); }
  else if(act === 'pick'){ answer(el.getAttribute('data-v')); }
  else if(act === 'next'){ nextQ(); }
  else if(act === 'set-count'){
    S.cfg.count = parseInt(el.getAttribute('data-n'), 10) || 20; save(); render();
  }else if(act === 'set-daily'){
    var nD = parseInt(el.getAttribute('data-n'), 10) || 20;
    var pl = S.daily[planKey(dkey())];
    S.cfg.daily = nD;
    if(pl && Object.keys(pl.done || {}).length){
      toast('오늘 데일리는 이미 진행 중입니다 — 새 설정은 내일부터 적용돼요');
      save(); return;
    }
    if(pl){ delete S.daily[planKey(dkey())]; }
    save(); render();
  }else if(act === 'start-focus'){
    startSession('focus', {subject: el.getAttribute('data-subject'), topic: el.getAttribute('data-topic'), n: S.cfg.count});
  }else if(act === 'start-wrong'){
    var open = wrongList(true);
    if(!open.length){ toast('다시 볼 문항이 없습니다'); return; }
    startSession('wrong', {n: Math.min(open.length, 20)});
  }else if(act === 'tab'){ view = {name:'wrong', tab: el.getAttribute('data-t')}; render(); }
  else if(act === 'resolve' || act === 'unresolve'){
    var id = el.getAttribute('data-id');
    if(S.wrong[id]){ S.wrong[id].res = act === 'resolve' ? 1 : 0; save(); render(); }
  }else if(act === 'solve-one'){
    var sid = el.getAttribute('data-id');
    if(byId.has(sid)){
      session = {mode:'wrong', ids:[sid], i:0, answered:{}, ok:0, subject:null, topic:null, date:dkey(), picked:null};
      view = {name:'quiz'}; render();
    }
  }else if(act === 'export'){ exportJSON(); }
  else if(act === 'import'){ document.getElementById('importfile').click(); }
  else if(act === 'reset'){
    if(confirm('학습 기록을 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?')){
      S = blank(); save(); view = {name:'home'}; session = null; render(); toast('기록을 초기화했습니다');
    }
  }else if(act === 'dismiss-install'){
    S.flags.installDismissed = true; save(); render();
  }
});
var memoT = 0;
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(!t) return;
  if(t.id === 'sq'){ view.q = t.value; fillSearch(); return; }
  if(t.getAttribute && t.getAttribute('data-memoid')){
    S.memo[t.getAttribute('data-memoid')] = t.value;
    clearTimeout(memoT);
    memoT = setTimeout(function(){ save(); }, 500);
  }
});
document.addEventListener('change', function(ev){
  if(ev.target && ev.target.id === 'importfile' && ev.target.files && ev.target.files[0]){
    importJSON(ev.target.files[0]);
  }
  if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-memoid')){
    S.memo[ev.target.getAttribute('data-memoid')] = ev.target.value; save();
  }
});
document.addEventListener('keydown', function(ev){
  if(view.name !== 'quiz' || !session) return;
  var tag = (ev.target && ev.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(ev.key === 'ArrowLeft' || ev.key === 'o' || ev.key === 'O'){ ev.preventDefault(); answer('O'); }
  else if(ev.key === 'ArrowRight' || ev.key === 'x' || ev.key === 'X'){ ev.preventDefault(); answer('X'); }
  else if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown'){
    if(session.answered[session.ids[session.i]]){ ev.preventDefault(); nextQ(); }
  }
});
window.addEventListener('scroll', function(){
  var t = document.getElementById('top');
  if(t) t.classList.toggle('scrolled', window.scrollY > 4);
}, {passive:true});
if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', function(){ if((S.flags.theme || 'system') === 'system') applyTheme(); });
}

/* 서비스 워커 */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){ window.__errs.push('sw: ' + e.message); });
  });
}

/* 시작 */
render();
(function splash(){
  var el = document.getElementById('splash');
  if(!el) return;
  var sub = document.getElementById('splashsub');
  if(sub) sub.textContent = BANK.length.toLocaleString() + '지문 · ' + SUBJECTS.length + '과목 O/X · ' + ddayText();
  function off(){ setTimeout(function(){ el.classList.add('off'); }, 560); }
  if(document.readyState === 'complete') off();
  else window.addEventListener('load', off);
  setTimeout(function(){ el.classList.add('off'); }, 2400);
})();

/* 테스트/디버그 핸들 */
window.__sebeop = {
  get state(){ return S; }, bank: BANK, view: function(){ return view; },
  session: function(){ return session; }, answer: answer, next: nextQ,
  start: startSession, totals: totals, scopeTotals: scopeTotals, wrongList: wrongList,
  subjectStats: subjectStats, topicStats: topicStats, rounds: rounds,
  scope: scope, setScope: function(s){ S.cfg.scope = s; save(); view = {name:'home'}; session = null; render(); },
  subjects: SUBJECTS, topics: TOPICS, errs: window.__errs,
  roundEntries: roundEntries, roundStat: roundStat, ROUNDS_BY_SUBJ: ROUNDS_BY_SUBJ,
  buildRoundIds: buildRoundIds, bookmarks: function(){ return Object.keys(S.book); },
  dnk: function(){ return Object.keys(S.dnk); }, memo: function(){ return S.memo; },
  dday: ddayText, startExam: startExam, exam: function(){ return exam; },
  examResult: function(){ return examResult; }, search: searchHits, toggleBook: toggleBook,
  examPrompt: examPrompt, hl: hl
};
})();
</script>
