/* ─────────── 테마 ─────────── */
function applyTheme(){
  var t = S.flags.theme || 'system';
  var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var btn = document.getElementById('themebtn');
  if(btn) btn.textContent = dark ? '☀️' : '🌙';
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark ? '#0a0f1e' : '#f4f6fb');
}

/* ─────────── 내보내기 / 불러오기 ─────────── */
function exportJSON(){
  var payload = {app:'sebeop-ox', v:2, exportedAt:new Date().toISOString(), bank:BANK.length, scope:scope(), data:S};
  var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'sebeop-ox-backup-' + dkey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast('백업 파일을 내보냈습니다');
}
function importJSON(file){
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var o = JSON.parse(rd.result);
      var d = o && o.data ? o.data : o;
      if(!d || typeof d !== 'object' || !d.ans || !d.days) throw new Error('형식이 맞지 않습니다');
      if(!confirm('지금 기록을 백업 파일로 덮어쓸까요?\n현재 ' + totals().n + '문항 · ' + Object.keys(S.ans || {}).length + '지문 → 가져올 ' +
                  (Object.keys(d.ans || {}).length ? totalsOf(d) + '문항 · ' + Object.keys(d.ans || {}).length + '지문' : '빈 기록'))) return;
      var b = blank();
      b.ans = d.ans || {}; b.wrong = d.wrong || {}; b.days = d.days || {}; b.daily = d.daily || {};
      b.streak = d.streak || b.streak; b.cfg = Object.assign(b.cfg, d.cfg || {});
      b.book = d.book || {}; b.memo = d.memo || {}; b.dnk = d.dnk || {};
      b.rc = (d.rc && typeof d.rc === 'object') ? d.rc : {};
      b.spd = (d.spd && typeof d.spd === 'object' && d.spd.n) ? d.spd : {n:0, ms:0};
      b.att = Array.isArray(d.att) ? d.att.slice(-600) : [];
      /* 풀던 세션·답안지도 백업에 담겨 있으므로 함께 되살린다 */
      b.resume = (d.resume && d.resume.ids && d.resume.ids.length) ? d.resume : null;
      b.exdraft = (d.exdraft && d.exdraft.items && d.exdraft.items.length) ? d.exdraft : null;
      if(b.cfg.scope !== '전체' && SUBJECTS.indexOf(b.cfg.scope) < 0) b.cfg.scope = '전체';
      b.cfg.pace = ([60, 90].indexOf(parseInt(b.cfg.pace, 10)) >= 0) ? parseInt(b.cfg.pace, 10) : 0;
      b.cfg.daily = 10; b.cfg.count = 10;
      b.flags = S.flags;
      S = b; save(); session = null; navReplace({name:'stats'});
      toast('기록을 불러왔습니다 · ' + totals().n + '문항');
    }catch(e){ toast('불러오기 실패: ' + e.message); }
  };
  rd.readAsText(file);
}

/* ─────────── 이벤트 ─────────── */
document.addEventListener('click', function(ev){
  /* 가린 숫자·기한 — 탭하면 보인다 */
  var bEl = ev.target.closest && ev.target.closest('.bl');
  if(bEl){ bEl.classList.toggle('on'); return; }
  /* 사용자가 펼친 상세(문제 원문·내 메모)는 뒤로가기 1회로 먼저 닫는다 */
  var sm = ev.target.closest && ev.target.closest('details > summary');
  if(sm){
    (function(d){
      setTimeout(function(){ if(d.open) d.setAttribute('data-backopen', '1'); else d.removeAttribute('data-backopen'); }, 0);
    })(sm.parentNode);
  }
  var el = ev.target.closest('[data-act]');
  var top = ev.target.closest('#themebtn, #statsbtn, #homebtn');
  if(top){
    if(top.id === 'themebtn'){
      var order = ['system','light','dark'];
      var cur = S.flags.theme || 'system';
      S.flags.theme = order[(order.indexOf(cur) + 1) % order.length];
      save(); applyTheme();
      toast(S.flags.theme === 'system' ? '테마: 기기 설정 따름' : S.flags.theme === 'dark' ? '테마: 다크' : '테마: 라이트');
    }else if(top.id === 'statsbtn'){
      if(view.name === 'stats') return;
      navPush({name:'stats'});
    }else{
      leaveQuiz(); navHome();
    }
    return;
  }
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act === 'scope'){
    var s2 = el.getAttribute('data-s');
    if(s2 === scope()) return;
    S.cfg.scope = s2; save();
    if(view.name === 'quiz' || view.name === 'done'){ leaveQuiz(); navHome(); }
    else render();
    toast('과목: ' + (s2 === '전체' ? '전체' : s2));
  }
  else if(act === 'daily'){
    var plan = S.daily[planKey(dkey())];
    if(plan && plan.ids && Object.keys(plan.done || {}).length >= plan.ids.length && plan.ids.length){
      delete S.daily[planKey(dkey())]; save();
    }
    startSession('daily');
  }else if(act === 'topics'){ navPush({name:'topics'}); }
  else if(act === 'rounds'){ navPush({name:'rounds'}); }
  else if(act === 'set-roundn'){
    S.cfg.roundN = parseInt(el.getAttribute('data-n'), 10) || 0; save(); render();
  }else if(act === 'review-one'){
    var rid = el.getAttribute('data-id');
    if(byId.has(rid)){
      var rq = byId.get(rid), ra = {};
      ra[rid] = rq.answer;
      session = {mode:'wrong', ids:[rid], i:0, answered:ra, ok:0, subject:null, topic:null,
                 date:dkey(), picked:null, review:true};
      navPush({name:'quiz'});
    }
  }else if(act === 'back-exam'){ session = null; try{ history.back(); }catch(e){ navReplace({name:'examresult'}); } }
  else if(act === 'book'){ navPush({name:'book'}); }
  else if(act === 'search'){ navPush({name:'search', q:''}); }
  else if(act === 'bookq'){ toggleBook(el.getAttribute('data-id')); }
  else if(act === 'blind'){
    var sy = window.scrollY;
    if(blindOn()){
      S.flags.blind = false; S.flags.blindw = false; S.flags.blindwho = false; BLIND_PANEL = false; save(); render();
      toast('빈칸 훈련을 껐습니다 — 지문을 그대로 보여 줍니다');
    }else{
      BLIND_PANEL = !blindPanelOpen(); render();
      if(BLIND_PANEL) toast('가릴 항목을 고르세요 — 숫자·기한 / 핵심어 / 주체·권한');
    }
    try{ window.scrollTo(0, sy); }catch(e){}
  }
  else if(act === 'blind-mode'){
    var bmM = el.getAttribute('data-m'), bsy = window.scrollY;
    if(bmM === 'num') S.flags.blind = !S.flags.blind;
    else if(bmM === 'word') S.flags.blindw = !S.flags.blindw;
    else if(bmM === 'who') S.flags.blindwho = !S.flags.blindwho;
    BLIND_PANEL = true;
    save(); render();
    try{ window.scrollTo(0, bsy); }catch(e){}
    toast(bmM === 'num'
      ? (S.flags.blind ? '숫자·기한을 가렸습니다 — ?를 탭하면 보입니다' : '숫자·기한을 그대로 보여 줍니다')
      : bmM === 'who'
      ? (S.flags.blindwho ? '주체·권한을 가렸습니다 — 누가 결정·처분하는지 떠올려 보세요' : '주체·권한을 그대로 보여 줍니다')
      : (S.flags.blindw ? '핵심어를 가렸습니다 — 서술어·범위어·예외 표지를 ?로' : '핵심어를 그대로 보여 줍니다'));
  }
  else if(act === 'blind-close'){
    BLIND_PANEL = false; render();
  }
  else if(act === 'rcause'){
    var rbox = el.closest('.rcause');
    var rqid = rbox ? rbox.getAttribute('data-rcid') : null;
    var rc = el.getAttribute('data-c');
    if(rqid && CAUSE[rc]){
      S.rc = S.rc || {};
      var prevRC = S.rc[rqid] && S.rc[rqid].c;
      if(prevRC === rc){ delete S.rc[rqid]; }
      else { S.rc[rqid] = {c:rc, at:Date.now()}; }
      save();
      var curRC = S.rc[rqid] ? S.rc[rqid].c : null;
      eachNode(rbox.querySelectorAll('button'), function(btn2){
        var bc = btn2.getAttribute('data-c');
        btn2.className = (curRC === bc ? 'on' : '') + (curRC ? '' : (bc === suggestCause(byId.get(rqid)) ? ' sug' : ''));
      });
      var rlb = rbox.querySelector('.lb');
      if(rlb) rlb.innerHTML = curRC ? ('오답 원인 · ' + CAUSE[curRC] + ' <span class="muted">(다시 고를 수 있어요)</span>')
                                    : '왜 틀렸나요? 하나만 골라 두면 내 약점 통계가 됩니다';
      toast(curRC ? '오답 원인: ' + CAUSE[curRC] : '오답 원인 태그를 지웠습니다');
    }
  }
  else if(act === 'ai'){
    var aq = byId.get(el.getAttribute('data-id'));
    if(aq) copyText(examPrompt(aq), '질문을 복사했습니다 — ChatGPT·Gemini에 붙여넣으세요');
  }else if(act === 'start-book'){
    if(!bookmarkCount()){ toast('북마크가 비어 있습니다'); return; }
    startSession('book', {n: Math.min(bookmarkCount(), 10)});
  }else if(act === 'start-exam'){
    startExam(el.getAttribute('data-subject'), parseInt(el.getAttribute('data-year'), 10), el.getAttribute('data-round'));
  }else if(act === 'xpick'){
    var xi = parseInt(el.getAttribute('data-i'), 10), xv = el.getAttribute('data-v');
    if(exam && exam.items[xi]){
      var xit = exam.items[xi];
      xit.pick = (xit.pick === xv ? null : xv);
      /* 그 문항에 머문 시간 — 페이스 초과를 문항 단위로 보고·결과에 남긴다 */
      xit.ms = xit.pick ? Math.max(0, Date.now() - (exam.lapAt || exam.at || Date.now())) : 0;
      exam.lapAt = Date.now();
      S.exdraft = exam; save();              /* 답안지도 한 문항씩 바로 저장 — 중간에 나와도 안 날아간다 */
      paintExamRow(xi);
      /* 미응답만 보기 중에 마지막 문항을 골랐다면 빈 목록에 남기지 않고 전체로 돌린다 */
      if(exam.only && !exam.items.some(function(it2){ return !it2.pick; })){ exam.only = 0; render(); }
    }
  }else if(act === 'xfilter'){
    if(!exam) return;
    exam.only = parseInt(el.getAttribute('data-f'), 10) ? 1 : 0;
    var xfy = window.scrollY;
    render();
    try{ window.scrollTo(0, exam.only ? 0 : xfy); }catch(e){}
  }else if(act === 'xsubmit'){
    if(!exam) return;
    var rest = exam.items.filter(function(it){ return !it.pick; }).length;
    if(rest && !confirm('미응답 ' + rest + '문항은 채점에서 빠집니다. 제출할까요?')) return;
    submitExam();
  }else if(act === 'set-pace'){
    var sp = parseInt(el.getAttribute('data-p'), 10) || 0;
    if(sp === (parseInt(S.cfg.pace, 10) || 0)) return;
    var psy = window.scrollY;
    S.cfg.pace = sp; save(); render();
    try{ window.scrollTo(0, psy); }catch(e){}
    toast(sp ? '문항당 ' + sp + '초 페이스 — 경과와 권장 시간을 같이 보여 줍니다' : '페이스 타이머를 껐습니다');
  }else if(act === 'start-round'){
    startSession('round', {subject: el.getAttribute('data-subject'),
      year: parseInt(el.getAttribute('data-year'), 10),
      round: el.getAttribute('data-round'), n: S.cfg.roundN || 0});
  }
  else if(act === 'wrong'){ navPush({name:'wrong', tab:'open'}); }
  else if(act === 'home'){ leaveQuiz(); navHome(); }
  else if(act === 'resume'){ resumeQuiz(); }
  else if(act === 'drop-resume'){ S.resume = null; save(); render(); toast('이어서 풀기에서 뺐습니다'); }
  else if(act === 'resume-exam'){
    var dft = S.exdraft;
    if(dft && dft.items && dft.items.length) startExam(dft.subject, dft.year, dft.round);
    else { S.exdraft = null; save(); render(); }
  }
  else if(act === 'drop-exam'){ S.exdraft = null; save(); render(); toast('답안지를 접었습니다'); }
  else if(act === 'pick'){ answer(el.getAttribute('data-v')); }
  else if(act === 'next'){ nextQ(); }
  else if(act === 'set-count'){
    S.cfg.count = parseInt(el.getAttribute('data-n'), 10) || 10; save(); render();
  }else if(act === 'set-daily'){
    var nD = parseInt(el.getAttribute('data-n'), 10) || 10;
    var pl = S.daily[planKey(dkey())];
    S.cfg.daily = nD;
    if(pl && Object.keys(pl.done || {}).length){
      toast('오늘 데일리는 이미 진행 중입니다 — 새 설정은 내일부터 적용돼요');
      save(); return;
    }
    if(pl){ delete S.daily[planKey(dkey())]; }
    save(); render();
  }else if(act === 'start-focus'){
    startSession('focus', {subject: el.getAttribute('data-subject'), topic: el.getAttribute('data-topic'), n: S.cfg.count});
  }else if(act === 'start-weak'){
    startSession('focus', {subject: el.getAttribute('data-subject'), topic: el.getAttribute('data-topic'), n: 10});
  }else if(act === 'retry'){
    var idsR = String(el.getAttribute('data-ids') || '').split(',').filter(function(x){ return x; });
    if(!idsR.length){ toast('다시 풀 지문이 없습니다'); return; }
    startSession('retry', {ids: idsR});
  }else if(act === 'start-drill'){
    var dInfo = drillInfo();
    if(!dInfo.total){ toast('취약 문항이 아직 없습니다 — 먼저 10문항 풀어 보세요'); return; }
    startSession('drill', {ids: dInfo.items.map(function(x){ return x.id; })});
  }else if(act === 'start-wrong'){
    var open = wrongList(true);
    if(!open.length){ toast('다시 볼 문항이 없습니다'); return; }
    startSession('wrong', {n: Math.min(open.length, 10)});
  }else if(act === 'tab'){ navReplace({name:'wrong', tab: el.getAttribute('data-t')}); }
  else if(act === 'resolve' || act === 'unresolve'){
    var id = el.getAttribute('data-id');
    if(S.wrong[id]){ S.wrong[id].res = act === 'resolve' ? 1 : 0; save(); render(); }
  }else if(act === 'solve-one'){
    var sid = el.getAttribute('data-id');
    if(byId.has(sid)){
      session = {mode:'wrong', ids:[sid], i:0, answered:{}, ok:0, subject:null, topic:null, date:dkey(), picked:null, noResume:true};
      navPush({name:'quiz'});
    }
  }else if(act === 'export'){ exportJSON(); }
  else if(act === 'import'){ document.getElementById('importfile').click(); }
  else if(act === 'reset'){
    if(confirm('학습 기록을 모두 지웁니다. 되돌릴 수 없습니다. 계속할까요?')){
      var keepFlags = S.flags;                 /* 학습 기록만 지우고 테마·설치 안내 설정은 그대로 둔다 */
      S = blank(); S.flags = keepFlags; save(); session = null; exam = null; examResult = null; navHome(); toast('기록을 초기화했습니다');
    }
  }else if(act === 'dismiss-install'){
    S.flags.installDismissed = true; save(); render();
  }
});
var memoT = 0;
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(!t) return;
  if(t.id === 'sq'){ view.q = t.value; fillSearch(); return; }
  if(t.getAttribute && t.getAttribute('data-memoid')){
    S.memo[t.getAttribute('data-memoid')] = t.value;
    clearTimeout(memoT);
    memoT = setTimeout(function(){ save(); }, 500);
  }
});
document.addEventListener('change', function(ev){
  if(ev.target && ev.target.id === 'importfile' && ev.target.files && ev.target.files[0]){
    importJSON(ev.target.files[0]);
  }
  if(ev.target && ev.target.getAttribute && ev.target.getAttribute('data-memoid')){
    S.memo[ev.target.getAttribute('data-memoid')] = ev.target.value; save();
  }
});
document.addEventListener('keydown', function(ev){
  if(view.name !== 'quiz' || !session) return;
  var tag = (ev.target && ev.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(ev.key === 'ArrowLeft' || ev.key === 'o' || ev.key === 'O'){ ev.preventDefault(); answer('O'); }
  else if(ev.key === 'ArrowRight' || ev.key === 'x' || ev.key === 'X'){ ev.preventDefault(); answer('X'); }
  else if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown'){
    if(session.answered[session.ids[session.i]]){ ev.preventDefault(); nextQ(); }
  }
});
window.addEventListener('scroll', function(){
  var t = document.getElementById('top');
  if(t) t.classList.toggle('scrolled', window.scrollY > 4);
}, {passive:true});
if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', function(){ if((S.flags.theme || 'system') === 'system') applyTheme(); });
}

/* 서비스 워커 — ?qa=1 점검 모드에서는 등록하지 않고 이 앱의 기존 등록·캐시만 정리한다
   (같은 도메인의 다른 앱 캐시는 건드리지 않는다) */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  if(/[?&]qa=1/.test(location.search)){
    var appBase = location.origin + location.pathname.replace(/[^\/]*$/, '');
    try{
      navigator.serviceWorker.getRegistrations().then(function(rs){
        rs.forEach(function(r){ if(r.scope === appBase) r.unregister(); });
      });
    }catch(e){}
    try{
      caches.keys().then(function(ks){
        ks.forEach(function(k){ if(k.indexOf('sebeop-ox-') === 0) caches.delete(k); });
      });
    }catch(e){}
  }else{
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ window.__errs.push('sw: ' + e.message); });
    });
  }
}

/* 시작 */
initHistory();
render();
setInterval(tickPace, 1000);   /* 답안지 페이스 타이머 — 화면에 없으면 아무 일도 하지 않는다 */
window.addEventListener('pagehide', function(){ if(session){ snapshotSession(); save(); } });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && session){ snapshotSession(); save(); }
  /* 다른 앱을 보는 동안은 답안지 시간에서 뺀다 — 돌아왔을 때 억울하게 '초과'가 뜨지 않게 */
  if(!exam) return;
  if(document.hidden){ exam.hidAt = Date.now(); }
  else if(exam.hidAt){
    var hidMs = Date.now() - exam.hidAt;
    exam.hidAt = 0;
    if(hidMs > 1000 && hidMs < 6 * 3600 * 1000){
      exam.at = (exam.at || Date.now()) + hidMs;
      exam.lapAt = (exam.lapAt || Date.now()) + hidMs;
    }
  }
});
(function splash(){
  var el = document.getElementById('splash');
  if(!el) return;
  var sub = document.getElementById('splashsub');
  if(sub) sub.textContent = BANK.length.toLocaleString() + '지문 · ' + SUBJECTS.length + '과목 O/X · ' + ddayText();
  function off(){ setTimeout(function(){ el.classList.add('off'); }, 560); }
  if(document.readyState === 'complete') off();
  else window.addEventListener('load', off);
  setTimeout(function(){ el.classList.add('off'); }, 2400);
})();

/* 테스트/디버그 핸들 */
window.__sebeop = {
  get state(){ return S; }, bank: BANK, view: function(){ return view; },
  session: function(){ return session; }, answer: answer, next: nextQ,
  start: startSession, totals: totals, scopeTotals: scopeTotals, wrongList: wrongList,
  subjectStats: subjectStats, topicStats: topicStats, rounds: rounds,
  scope: scope, setScope: function(s){ S.cfg.scope = s; save(); HSTACK = []; view = {name:'home'}; session = null; render(); },
  subjects: SUBJECTS, topics: TOPICS, errs: window.__errs,
  roundEntries: roundEntries, roundStat: roundStat, ROUNDS_BY_SUBJ: ROUNDS_BY_SUBJ,
  buildRoundIds: buildRoundIds, bookmarks: function(){ return Object.keys(S.book); },
  dnk: function(){ return Object.keys(S.dnk); }, memo: function(){ return S.memo; },
  dday: ddayText, startExam: startExam, exam: function(){ return exam; },
  examResult: function(){ return examResult; }, search: searchHits, toggleBook: toggleBook,
  examPrompt: examPrompt, hl: hl,
  resume: function(){ return S.resume; }, hstack: function(){ return HSTACK; },
  resumeQuiz: resumeQuiz, leaveQuiz: leaveQuiz, HOME: function(){ leaveQuiz(); navHome(); },
  weakness: weakness, weakLine: weakLine, startRetry: function(ids){ startSession('retry', {ids:ids}); },
  suggestCause: suggestCause, causeCounts: causeCounts, blindHTML: blindHTML, CAUSE: CAUSE,
  setBlind: function(v){ S.flags.blind = !!v; save(); render(); },
  setBlindWord: function(v){ S.flags.blindw = !!v; save(); render(); },
  setBlindWho: function(v){ S.flags.blindwho = !!v; save(); render(); },
  maskHTML: maskHTML, maskRanges: maskRanges, blindCoverage: blindCoverage,
  blindNumOn: blindNumOn, blindWordOn: blindWordOn, blindWhoOn: blindWhoOn, blindPanel: blindPanelOpen,
  causeByTopic: causeByTopic, causeTopMap: causeTopMap, fmtClock: fmtClock, paceState: paceState,
  setPace: function(v){ S.cfg.pace = parseInt(v, 10) || 0; save(); render(); },
  rc: function(){ return S.rc; }, spd: function(){ return S.spd; },
  att: function(){ return S.att; }, drill: drillInfo, timeBuckets: timeBuckets,
  timeCard: timeCardHTML, drillCard: drillCardHTML, paceRef: paceRef,
  trapRows: trapRows, trapCard: trapCardHTML, trapInline: trapInline, TRAP_PAIRS: TRAP_PAIRS,
  terms: TERM_WORDS, termHits: termHits, logAtt: logAtt,
  startDrill: function(){ var d = drillInfo(); if(d.total) startSession('drill', {ids:d.items.map(function(x){ return x.id; })}); }
};
})();
</script>
